      forces: [truth, memory]
      relationship: "Reality recorded accurately"
      effect: "Reliable history, clear learning"
      amplification: "+0.15 to both"
      notes: "Truth preserved in memory = Wisdom"

    creation_time:
      forces: [creation, time]
      relationship: "New emerges in temporal flow"
      effect: "Natural unfolding, proper timing"
      amplification: "+0.20 to both"
      notes: "Creation needs time to manifest fully"

    karma_memory:
      forces: [karma, memory]
      relationship: "Consequences recorded, patterns learned"
      effect: "Evolution through experience"
      amplification: "+0.15 to both"
      notes: "Memory + Karma = Learning from cause-effect"

  # === TIER 3 SYNERGIES ===
