# Synergistic Force Pairs
# Forces that amplify and enhance each other when active simultaneously
# Source: INTERACTION_MECHANICS.md

synergistic_pairs:
  # === PRINCIPLE ===
  principle: |
    Synergistic forces AMPLIFY each other - the whole is greater than the sum.
    When both active, they reinforce, enhance, and strengthen each other's effects.

    Visual effect: Harmonious blending, enhanced vibrancy, beautiful interaction.

  # === TIER 1 SYNERGIES ===
  tier_1_synergies:
    consciousness_truth:
      forces: [consciousness, truth]
      relationship: "Awareness reveals reality"
      effect: "Enhanced clarity - seeing what IS"
      amplification: "+0.20 to both forces"
      notes: "Consciousness + Truth = Enlightened seeing"

    pattern_coherence:
      forces: [pattern, coherence]
      relationship: "Order integrates into harmony"
      effect: "Perfect sacred geometry emerges"
      amplification: "+0.25 to both"
      notes: "Pattern organized by coherence = Beauty"

    consciousness_coherence:
      forces: [consciousness, coherence]
      relationship: "Awareness unifies fragmentation"
      effect: "Integration accelerates"
      amplification: "+0.30 to both"
      notes: "Core synergy - awareness creates coherence"

    pattern_consciousness:
      forces: [pattern, consciousness]
      relationship: "Awareness recognizes pattern"
      effect: "Meaning emerges from structure"
      amplification: "+0.15 to both"
      notes: "Seeing the code beneath reality"

  # === TIER 2 SYNERGIES ===
