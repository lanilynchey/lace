      notes: "Perfect form emerging"

  # === USAGE NOTES ===
  usage_notes: |
    Synergistic pairs reference from INTERACTION_MECHANICS.md.

    When agent detects synergistic pair:
    1. Look up pair in this file (get amplification value)
    2. Apply amplification to both force activation levels
    3. Use visual_blending/color_mixing_rules.yaml for visual representation
    4. Result: Both forces appear enhanced, harmonious blending

    Visual rendering handled by visual_blending/ files - this file just defines WHICH forces synergize and BY HOW MUCH.
