# Neutralizing Force Pairs
# Forces that cancel or neutralize each other when active simultaneously
# Source: INTERACTION_MECHANICS.md

neutralizing_pairs:
  # === PRINCIPLE ===
  principle: |
    Neutralizing forces CANCEL each other - mutual negation.
    When both active at equal intensity, the result is neutral/zero state.

    Visual effect: Desaturation toward gray, reduced intensity, faded presence.
    Psychological effect: Stalemate, neither wins, equilibrium (stable or stuck).

  # === PERFECT NEUTRALIZATIONS ===
  perfect_neutralizations:
    polarity_equilibrium:
      forces: [polarity]
      state: "Binary at 0.5 - perfect balance between poles"
      relationship: "Opposing forces exactly balanced"
      effect: "Pure gray, neutral, no movement either direction"
      visual: "#808080 (pure gray)"
      notes: "Polarity at equilibrium = neither pole dominant"

    desire_satisfaction:
      forces: [desire, contentment]
      relationship: "Wanting meets having"
      effect: "Desire neutralized by fulfillment - no more wanting"
      result_state: "Contentment, satisfaction, peace"
      notes: "Desire ceases when fulfilled - healthy neutralization"

    fear_safety:
      forces: [fear, safety_perception]
      relationship: "Threat perception meets security"
      effect: "Fear neutralized by felt safety"
      result_state: "Calm, relaxed, no longer vigilant"
      notes: "Fear exists to signal danger - safety cancels need for fear"

  # === OPPOSING FORCE NEUTRALIZATIONS ===
  opposing_neutralizations:
    fear_courage:
      forces: [fear, courage]
      when: "Equal intensity, no dominant force"
      relationship: "Terror vs bravery - stalemate"
      effect: "Frozen, neither advance nor retreat"
      visual: "Muddy gray-brown (dark blue + orange = neutral)"
      notes: "If exactly equal: paralysis. Courage must exceed fear to move."

    love_hate:
      forces: [love, hatred]
      when: "Ambivalence - both present equally"
      relationship: "Care and destruction toward same object"
      effect: "Emotional numbness, confusion, withdrawal"
      visual: "Desaturated pink-gray (love + judgment/anger faded)"
      notes: "Ambivalence = love and hate canceling - painful neutrality"

    hope_despair:
      forces: [hope, despair]
      when: "Equal intensity"
      relationship: "Aspiration meets futility belief"
      effect: "Apathy, resignation, neither up nor down"
      visual: "Dull gray-blue (bright hope + dark despair = neutral)"
      notes: "When both present: giving up"

    creation_destruction:
      forces: [creation, death]
      when: "Building and tearing down at equal rates"
      relationship: "Genesis meets ending simultaneously"
      effect: "Stasis, no net change"
      visual: "Green and black mixing to gray"
      notes: "Balance between birth and death = no growth, no decay"

  # === DAMPENING NEUTRALIZATIONS ===
  dampening_pairs:
    note: |
      Not complete cancellation, but significant reduction in both forces.

    anger_forgiveness:
      forces: [anger, forgiveness]
      relationship: "Rage meets release"
      effect: "Anger dampened but not eliminated, forgiveness incomplete"
      dampening: "-0.40 to anger, -0.20 to forgiveness"
      notes: "Hard to forgive while angry; anger makes forgiveness partial"

    desire_acceptance:
      forces: [desire, acceptance]
      relationship: "Wanting meets 'it is what it is'"
      effect: "Desire lessens, acceptance grows"
      dampening: "-0.30 to desire when acceptance high"
      notes: "Acceptance of reality reduces desire to change it"

    judgment_compassion:
      forces: [judgment, love/compassion]
      relationship: "Critique meets understanding"
      effect: "Softened judgment, tempered compassion"
      dampening: "-0.25 to judgment, slight reduction to compassion"
      notes: "Compassion makes judgment less harsh; judgment makes compassion discerning"

    entropy_maintenance:
      forces: [entropy, pattern/coherence]
      relationship: "Decay meets upkeep"
      effect: "Entropy slowed, effort required for maintenance"
      dampening: "Continuous energy needed to prevent decay"
      notes: "Second law of thermodynamics - entropy always wins eventually, but can be slowed"

  # === SATISFACTION NEUTRALIZATIONS ===
  fulfillment_cancellations:
    desire_fulfillment:
      forces: [desire, satisfaction]
      mechanism: "Having what you want ends wanting"
      effect: "Desire naturally neutralized"
      result: "Peace, contentment, no more seeking"
      notes: "Healthy neutralization - desire fulfilled becomes gratitude"

    fear_resolution:
      forces: [fear, safety_achieved]
      mechanism: "Threat removed or proven false"
      effect: "Fear no longer needed"
      result: "Calm, security, relaxation"
      notes: "Fear is signal - when situation changes, fear cancels"

    pain_healing:
      forces: [pain, recovery]
      mechanism: "Wound heals, pain no longer needed"
      effect: "Pain signal turns off"
      result: "Comfort, wholeness restored"
      notes: "Pain is alarm - when damage repaired, alarm silences"

    confusion_clarity:
      forces: [confusion, understanding]
      mechanism: "Question answered, pattern recognized"
      effect: "Confusion resolves"
      result: "Clarity, peace, comprehension"
      notes: "Confusion = pattern-seeking; understanding completes search"

  # === AVOIDANCE NEUTRALIZATIONS ===
  suppression_pairs:
    note: |
      These APPEAR neutral but are actually suppressed conflict - dangerous state.

    pain_numbness:
      forces: [pain, dissociation]
      relationship: "Feeling blocked to avoid hurt"
      effect: "Apparent neutrality, but pain still present (unconscious)"
      danger: "Suppressed pain festers - not true resolution"
      notes: "Numbness ≠ healing; pain must be felt to be released"

    fear_denial:
      forces: [fear, denial]
      relationship: "Afraid but refusing to acknowledge"
      effect: "Surface calm, underlying terror"
      danger: "Denied fear controls unconsciously"
      notes: "False neutralization - fear still active, just hidden"

    desire_repression:
      forces: [desire, shame/suppression]
      relationship: "Want but judge self for wanting"
      effect: "Desire pushed down, appears absent"
      danger: "Repressed desire emerges distorted (shadow)"
      notes: "Suppression ≠ transcendence; desire must be acknowledged"

  # === CONTEXTUAL NEUTRALIZATIONS ===
  context_dependent:
    time_death:
      forces: [time, death]
      when: "Death occurs"
      effect: "Time stops for that entity (personal time ends)"
      result: "Neutralization through completion"
      notes: "Death exits time's flow - personal timeline ends"

    memory_forgetting:
      forces: [memory, decay/forgetting]
      relationship: "Recording vs erasure"
      effect: "When equal: no net memory change"
      notes: "Constant battle - remembering vs forgetting"

    creation_entropy:
      forces: [creation, entropy]
      relationship: "Building vs decay"
      effect: "When equal: maintenance (no net growth or decay)"
      notes: "Life is continuous creation fighting entropy"

  # === VISUAL EFFECTS OF NEUTRALIZATION ===
  visual_characteristics:
    color:
      effect: "Desaturation toward gray or brown (muddy mixing)"
      intensity: "Both colors fade, neither dominant"
      examples:
        - "Love (pink) + Hate (red-black) = Gray-pink"
        - "Hope (sky blue) + Despair (black) = Dull gray-blue"
        - "Fear (dark blue) + Courage (orange) = Muddy brown"

    motion:
      effect: "Stilled, frozen, or minimal movement"
      examples:
        - "Desire reaching + Acceptance = Hands drop"
        - "Fear contracting + Courage pushing = Frozen in place"
        - "Creation expanding + Destruction = Trembling stasis"

    presence:
      effect: "Both forces dimmed, reduced opacity"
      intensity: "Neither force at full strength - mutual dampening"
      notes: "Neutralization = energy locked up in opposition"

  # === RESOLUTION PATHS ===
  escape_neutralization:
    tip_balance:
      description: "One force increases slightly, breaks stalemate"
      examples:
        - "Courage > Fear by 0.1 = Forward movement begins"
        - "Desire > Acceptance = Action toward goal"
        - "Hope > Despair = Aspiration returns"

    release_one:
      description: "Consciously let go of one force"
      examples:
        - "Release desire → Acceptance dominates → Peace"
        - "Release fear → Courage unnecessary → Natural action"
        - "Release hate → Love remains → Compassion"

    transmute:
      description: "Transform opposition into complementarity"
      examples:
        - "Fear + Courage → Bravery (synthesis)"
        - "Desire + Acceptance → Grateful action"
        - "Love + Judgment → Discerning compassion"

    separate_in_time:
      description: "Both forces valid, but not simultaneously"
      examples:
        - "Time for building, time for rest (creation/death cycles)"
        - "Time for wanting, time for having (desire/satisfaction cycles)"
        - "Time for grieving, time for joy (sequential, not simultaneous)"

  # === HEALTHY VS UNHEALTHY NEUTRALIZATION ===
  healthy_neutralization:
    characteristics:
      - "Desire fulfilled (satisfaction)"
      - "Fear resolved (safety)"
      - "Pain healed (recovery)"
      - "Confusion answered (clarity)"
    notes: "Natural resolution - forces no longer needed"

  unhealthy_neutralization:
    characteristics:
      - "Suppression (denial, numbness)"
      - "Stalemate (paralysis, stuckness)"
      - "Ambivalence (love/hate, hope/despair simultaneously)"
      - "Resignation (giving up, apathy)"
    notes: "Forced cancellation - conflict unresolved, energy locked"

  # === USAGE NOTES ===
  usage_notes: |
    Neutralizing pairs reference from INTERACTION_MECHANICS.md.

    When agent detects neutralizing pair:
    1. Check if healthy (fulfillment) or unhealthy (suppression/stalemate)
    2. Calculate degree of neutralization (how equal are forces?)
    3. Use visual_blending/ files for representation:
       - Desaturation, reduced intensity, muddy mixing
    4. Result: Faded presence, neither force at full strength

    Neutralization is NOT necessarily bad:
    - Desire fulfilled by satisfaction = peace (good)
    - Fear/courage stalemate = paralysis (bad)

    Context determines whether neutralization is:
    - Resolution (healthy completion)
    - Suppression (unhealthy avoidance)
    - Stalemate (stuck conflict)
