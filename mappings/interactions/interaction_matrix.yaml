# Force Interaction Matrix (26×26)

# ⚠️ MAPPINGS DISPLAY DOCS - NOTHING ORIGINATES HERE
# This matrix CONSOLIDATES interaction data from force_to_force/ mapping files.
# All interaction details (relationship, effect, amplification) exist in those files.
# This matrix provides QUICK LOOKUP of interaction types for autonomous agents.

source_data:
  - "mappings/interactions/force_to_force/synergistic_pairs.yaml"
  - "mappings/interactions/force_to_force/antagonistic_pairs.yaml"
  - "mappings/interactions/force_to_force/neutralizing_pairs.yaml"
  - "mappings/interactions/force_to_force/complex_interactions.yaml"

source_docs:
  - "docs/03_mechanics/interaction_mechanics/ (conceptual foundation)"
  - "docs/02_forces/ (individual force interactions)"

description: |
  26×26 matrix showing interaction type for all 676 possible force pairs (including self).
  This file DISPLAYS data from force_to_force mapping files in matrix format for quick lookup.

  Agent lookup flow:
  1. Check this matrix → get TYPE (synergistic/antagonistic/neutralizing/complex/recursive/none)
  2. Go to force_to_force/{type}_pairs.yaml → get DETAILS (relationship, effect, amplification)
  3. Go to visual_blending/color_mixing_rules.yaml → get VISUAL rendering instructions

interaction_types:
  synergistic: "Forces amplify each other (harmonious, enhancing)"
  antagonistic: "Forces oppose each other (conflict, tension)"
  neutralizing: "Forces cancel each other (dampening, balancing)"
  complex: "Multi-stage interaction (transmutation, synthesis, context-dependent)"
  recursive: "Force interacts with itself (feedback loops, self-amplification)"
  none: "No documented interaction or minimal interaction"

force_list:
  tier_1: [entropy, consciousness, pattern, coherence, polarity]
  tier_2: [time, karma, truth, memory, death, creation]
  tier_3: [desire, fear, love, hope, forgiveness, pain, judgment]
  tier_4: [art, music, war, madness, beauty, luck, humor, courage]
  total: 26

matrix_size:
  total_cells: 676  # 26 × 26
  diagonal: 26      # Force × itself
  unique_pairs: 325 # (676 - 26) / 2 (excluding diagonal, accounting for symmetry)

