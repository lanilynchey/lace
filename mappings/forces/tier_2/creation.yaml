# Force Mapping: Creation

creation:
  # === METADATA ===
  metadata:
    tier: 2
    category: "governing"  # Foundational force that shapes reality
    dependencies: ["coherence", "consciousness", "pattern"]
    source_doc: "docs/02_forces/tier_2_forces/06_creation.md"

  # === COLOR PROPERTIES ===
  color_properties:
    base_color: "#00FF7F"  # Spring green - fresh, new, generative
    color_family: "cool"
    color_range:
      - "#228B22"  # Forest green (nascent creation)
      - "#00FF7F"  # Spring green (active creation)
      - "#7FFF00"  # Chartreuse (vibrant creation)
      - "#F0FFF0"  # Honeydew - pale green-white (ultimate creation)

    saturation_base: 0.80
    brightness_base: 0.85

    intensity_modifier:
      low_activation:    # 0.1-0.3 (seeds, potential)
        color: "#228B22"
        saturation: 0.65
        brightness: 0.60
      medium_activation: # 0.4-0.7 (active manifestation)
        color: "#00FF7F"
        saturation: 0.80
        brightness: 0.85
      high_activation:   # 0.8-1.0 (explosive creativity)
        color: "#7FFF00"
        saturation: 0.90
        brightness: 0.95

    notes: |
      Green represents growth, life, generation, newness.
      Spring green = fresh sprouts, new life emerging.
      As creation increases, becomes brighter, more vibrant.
      At highest levels, approaches white-green - pure generative force.
      Opposite of death's black - creation is bringing into being.

  # === SHAPE PROPERTIES ===
  shape_properties:
    primary_shape: "emanating_burst"  # Radiating outward, generating, birthing
    sacred_geometry_association: "seed_of_life"  # Genesis pattern, 7 circles
    complexity_level: "complex"
    edge_type: "expanding"  # Always growing, extending
    dimensionality: "4D"  # Creation brings things into time/space

    activation_modulation:
      low_activation: |
        Small seed pattern, potential condensed.
        Creation nascent, not yet manifested.
        Seed of Life visible but small.
      medium_activation: |
        Clear burst radiating outward.
        Forms generating actively.
        Seed of Life expanding, multiplying.
      high_activation: |
        Explosive emanation in all directions.
        Forms bursting into being everywhere.
        Seed of Life fractally replicating.
        May appear as supernova or big bang - ultimate generation.

    notes: |
      Emanating burst = creation radiates outward, generates.
      Seed of Life = genesis pattern (7 circles, sacred geometry of creation).
      Always expanding - creation is growth, generation, birthing.
      At high activation, like supernova - explosive generation.
      Opposite of death's collapsing void - creation expands infinitely.

  # === MOTION PROPERTIES ===
  motion_properties:
    movement_type: "generating"  # Bringing into being, manifesting
    speed_base: 0.60  # Moderate-fast - creation is energetic

    speed_modifier:
      low_intensity: 0.35   # Slow generation, building gradually
      medium_intensity: 0.60  # Active manifestation
      high_intensity: 0.90   # Rapid creation, explosive generation

    direction: "outward_expanding"  # All directions, radiating, growing
    rhythm: "pulsing"  # Waves of creation, generative cycles

    healthy_pattern:
      description: "Conscious creation - manifesting with intention, creating from alignment"
      characteristics:
        - "Creates with clear intention"
        - "Manifestation aligned with values"
        - "Generates value, beauty, meaning"
        - "Creation serves growth"

    stuck_pattern:
      description: "Compulsive creation or creative block - either can't stop or can't start"
      characteristics:
        - "Creating to avoid being"
        - "Productivity addiction"
        - "Or: total creative block, paralysis"
        - "Creation from ego, not essence"

    notes: |
      Generating motion = bringing into existence.
      Outward expansion = creation radiates in all directions.
      Pulsing rhythm = creative cycles, waves of manifestation.
      Healthy: conscious creation, aligned manifestation.
      Stuck: either compulsive (can't stop creating) or blocked (can't start).
      Creation is birthing - can be painful, always transformative.

  # === VIBRANCY & SATURATION ===
  vibrancy_saturation:
    vibrancy_base: 0.85  # Highly vibrant (creation is alive, energetic)

    coherence_impact:
      high_coherence:    # 0.7-1.0
        modifier: "+0.20"  # High coherence amplifies creation
        description: "Powerful manifestation, creation aligned and effortless"
      medium_coherence:  # 0.4-0.7
        modifier: "0.0"
        description: "Normal creative capacity"
      low_coherence:     # 0.0-0.3
        modifier: "-0.30"  # Low coherence blocks creation
        description: "Creative block, fragmented attempts, or compulsive misaligned creation"

    intensity_scaling:
      formula: "vibrancy = base + (activation_level * 0.30)"
      multiplier: 0.30

    interaction_modifier:
      synergistic: "+0.20 to +0.30"  # With coherence, consciousness, pattern, love
      antagonistic: "-0.30 to -0.50"  # Opposed by entropy, death, fear
      neutral: "0.0"

    notes: |
      Creation is naturally vibrant, alive, generative.
      At high coherence, creation flows effortlessly (aligned manifestation).
      At low coherence, either blocked (can't create) or misaligned (creating from ego).
      Coherence + Consciousness = conscious creation (most powerful).

  # === ADDITIONAL PROPERTIES ===
  additional_properties:
    texture: "organic"
    opacity_range:
      min: 0.60  # Somewhat solid (creation has presence)
      max: 0.95  # Can be very solid (manifested forms are real)

    particle_effects: true
    particle_type: "generative_sparks"  # New forms emerging, manifestation
    particle_density: "dense"

    sound_association:
      frequency_hz: 639  # Solfeggio frequency for "connection and relationships" (creation connects)
      tone_description: "Vibrant, generative, like orchestra warming up - potential becoming actual"
      musical_note: "D"

    emotional_tone: "generative, expansive, birthing, manifesting, energetic"

    consciousness_association: null  # Creation exists at all consciousness levels

    notes: |
      Organic texture = creation is alive, growing, natural.
      Generative sparks = new forms emerging, manifestation happening.
      Orchestra warming up = potential organizing into manifestation.
      Denser than consciousness (creation makes solid forms).
      639 Hz = connection (creation connects ideas/energy to form).

  # === INTERACTION EFFECTS ===
  interaction_effects:
    synergistic_with:
      - "coherence"  # Coherence enables aligned creation
      - "consciousness"  # Consciousness directs creation
      - "pattern"  # Pattern structures creation
      - "love"  # Love inspires creation
      - "desire"  # Desire motivates creation
      - "hope"  # Hope envisions creation

    antagonistic_with:
      - "death"  # Death ends, creation begins
      - "entropy"  # Chaos disrupts creation
      - "fear"  # Fear blocks creation

    neutralizes: []

    amplified_by:
      - "coherence"  # Alignment amplifies manifestation
      - "consciousness"  # Awareness strengthens creation
      - "desire"  # Wanting provides creative energy

    visual_blending_rules:
      when_combined_with_death:
        force: "death"
        color_effect: "opposite"  # Green burst vs black void - fundamental polarity
        shape_effect: "separate_opposing"  # Expansion vs collapse
        motion_effect: "opposite"  # Generating vs stilling
        result_description: |
          Creation and Death are polar opposites.
          Green bursting forms vs black void.
          Beginning vs Ending.
          Death clears space for new creation.
          Eternal cycle: death → creation → death → creation.
          "From ashes, new life springs."
        coherence_dependent: false

      when_combined_with_coherence:
        force: "coherence"
        color_effect: "blend"  # Green + gold = radiant manifestation
        shape_effect: "merge"  # Both generate perfect forms
        motion_effect: "synchronized"  # Perfect creative flow
        result_description: |
          Coherence + Creation = conscious manifestation.
          Green burst within golden sphere.
          Aligned creation - manifesting from wholeness.
          This is "flow state" in creative work.
          Most powerful manifestation combination.
          "Ask, believing, and you will receive."
        coherence_dependent: false

      when_combined_with_consciousness:
        force: "consciousness"
        color_effect: "blend"  # Green + lavender = conscious creation
        shape_effect: "merge"  # Awareness directs generation
        motion_effect: "synchronized"  # Intentional manifestation
        result_description: |
          Consciousness directs creative force.
          Green burst within lavender sphere.
          Conscious creation - aware manifestation.
          Thought → Form (consciousness creates reality).
          This is "magic" - consciousness manifesting directly.
        coherence_dependent: false

      when_combined_with_pattern:
        force: "pattern"
        color_effect: "blend"  # Green + turquoise = structured creation
        shape_effect: "merge"  # Pattern structures manifestation
        motion_effect: "synchronized"  # Organized generation
        result_description: |
          Pattern provides blueprint for creation.
          Green burst following turquoise geometries.
          Structured manifestation - form follows pattern.
          Architecture, design, organized creation.
          "Divine blueprint" manifesting through pattern.
        coherence_dependent: false

      when_combined_with_love:
        force: "love"
        color_effect: "blend"  # Green + pink = loving creation
        shape_effect: "merge"  # Both radiate, expand
        motion_effect: "synchronized"  # Harmonious generation
        result_description: |
          Love inspires creation.
          Green burst within pink radiance.
          Creating from love - art, service, gifts.
          Most beautiful creations come from love.
          "Labor of love" - creation as offering.
        coherence_dependent: false

      when_combined_with_desire:
        force: "desire"
        color_effect: "blend"  # Green + crimson = passionate creation
        shape_effect: "merge"  # Both reach outward
        motion_effect: "energized"  # Desire fuels creation
        result_description: |
          Desire provides energy for creation.
          Green burst with crimson energy.
          Passionate manifestation - drive to make real.
          Ambition, building, achieving.
          Desire → Creation = manifestation of wants.
        coherence_dependent: false

      when_combined_with_hope:
        force: "hope"
        color_effect: "blend"  # Green + sky blue = inspired creation
        shape_effect: "merge"  # Both move toward future
        motion_effect: "synchronized"  # Creating envisioned future
        result_description: |
          Hope envisions, creation manifests.
          Green burst with sky blue spiral.
          Bringing hoped-for future into being.
          Vision → Reality.
          "Build the world you want to see."
        coherence_dependent: false

      when_combined_with_entropy:
        force: "entropy"
        color_effect: "clash"  # Green vs gray - generation vs decay
        shape_effect: "separate_opposing"  # Forms emerging vs dissolving
        motion_effect: "struggling"  # Creation fights chaos
        result_description: |
          Creation vs Entropy = order vs chaos.
          Green forms trying to emerge from gray dissolution.
          At high coherence: creation overcomes entropy (manifestation succeeds).
          At low coherence: entropy disrupts creation (manifestation blocked).
          Eternal tension - all created things eventually decay.
        coherence_dependent: true

      when_combined_with_fear:
        force: "fear"
        color_effect: "clash"  # Green vs dark blue - creation vs contraction
        shape_effect: "separate_opposing"  # Expansion vs withdrawal
        motion_effect: "blocked"  # Fear blocks creation
        result_description: |
          Fear blocks creative expression.
          Green burst trying to emerge from dark contracted form.
          At high coherence: creation overcomes fear (courage to create).
          At low coherence: fear paralyzes creation (creative block).
          "Perfectionism" = fear blocking creation.
        coherence_dependent: true

    notes: |
      Creation is the generative force - brings new into being.
      Creation + Coherence = conscious manifestation (aligned creation).
      Creation + Consciousness = intentional manifestation (thought → form).
      Creation + Pattern = structured manifestation (blueprint → form).
      Creation + Love = creation as offering, gift, service.
      Creation + Desire = ambition, drive to manifest wants.
      Creation + Hope = vision manifesting into reality.
      Creation + Death = eternal cycle (death creates space for new).
      Creation + Entropy = tension (all created things decay).
      Creation + Fear = creative block (fear prevents expression).
      At high coherence + consciousness: creation flows effortlessly.
      At low coherence: either blocked or misaligned (creating from ego).
      Key insight: "You are a creator" - fundamental human capacity.
      Key insight: Coherence + Consciousness + Creation = conscious manifestation.

# IMPLEMENTATION NOTES:
# - Creation is Tier 2 "governing" force - fundamental capacity
# - Humans are creators - this is our nature
# - Creation requires energy (desire/motivation) + direction (consciousness) + alignment (coherence)
# - Healthy creation: aligned, intentional, generative, serves growth
# - Stuck creation: compulsive (avoiding) or blocked (fear)
# - Visual should feel expansive, generative, birthing, energetic
# - Green represents life, growth, new forms emerging
# - Seed of Life = genesis pattern, sacred geometry of creation
# - At high coherence + consciousness: manifestation effortless
# - At low coherence: manifestation blocked or misaligned
# - Key insight: Creation and Death are polar cycle (eternal rhythm)
# - Key insight: Fear is primary block to creation (perfectionism, procrastination)
# - Key insight: Love + Creation = most beautiful manifestations
# - "You are what you create" - creation reveals consciousness
