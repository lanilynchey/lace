# Force Mapping: Hope

hope:
  # === METADATA ===
  metadata:
    tier: 3
    category: "interface"  # Emotional/experiential force
    dependencies: ["polarity", "consciousness"]
    source_doc: "docs/02_forces/tier_3_forces/04_hope.md"

  # === COLOR PROPERTIES ===
  color_properties:
    base_color: "#87CEEB"  # Sky blue - bright, uplifting, expansive
    color_family: "cool"
    color_range:
      - "#4682B4"  # Steel blue (cautious hope)
      - "#87CEEB"  # Sky blue (active hope)
      - "#ADD8E6"  # Light blue (strong hope)
      - "#F0FFFF"  # Azure - nearly white with blue tint (transcendent hope)

    saturation_base: 0.70
    brightness_base: 0.85

    intensity_modifier:
      low_activation:    # 0.1-0.3 (faint hope, glimmer)
        color: "#4682B4"
        saturation: 0.55
        brightness: 0.70
      medium_activation: # 0.4-0.7 (clear hope, optimism)
        color: "#87CEEB"
        saturation: 0.70
        brightness: 0.85
      high_activation:   # 0.8-1.0 (radiant hope, faith)
        color: "#F0FFFF"
        saturation: 0.40  # Becomes more ethereal
        brightness: 1.00

    notes: |
      Sky blue represents openness, possibility, looking up.
      Bright, clear, uplifting - opposite of fear's dark contraction.
      As hope increases, becomes lighter, more radiant.
      At highest levels, approaches white with blue glow - faith, transcendence.
      "Light at end of tunnel" - hope illuminates future path.

  # === SHAPE PROPERTIES ===
  shape_properties:
    primary_shape: "rising_spiral"  # Upward movement, evolution, growth
    sacred_geometry_association: "golden_spiral"  # Natural growth, fibonacci expansion
    complexity_level: "medium"
    edge_type: "smooth"  # Flowing, graceful movement
    dimensionality: "3D"

    activation_modulation:
      low_activation: |
        Small spiral beginning to rise.
        Faint glow, tentative upward movement.
        "Maybe it's possible..."
      medium_activation: |
        Clear spiral rising steadily.
        Golden ratio visible in growth pattern.
        Confident upward trajectory.
        "It will get better."
      high_activation: |
        Radiant spiral expanding infinitely upward.
        Golden spiral brilliant and clear.
        Unstoppable ascension, transcendent momentum.
        "All things are possible."

    notes: |
      Rising spiral = upward growth, evolution, improvement.
      Golden spiral = natural, organic expansion (not forced).
      Always moving upward and forward - future orientation.
      At high levels, spiral appears infinite - limitless possibility.

  # === MOTION PROPERTIES ===
  motion_properties:
    movement_type: "rising"  # Upward, forward, toward future
    speed_base: 0.50  # Moderate, steady ascent

    speed_modifier:
      low_intensity: 0.30   # Slow rise, cautious optimism
      medium_intensity: 0.50  # Steady climb, clear momentum
      high_intensity: 0.75   # Rapid ascent, soaring

    direction: "upward_forward"  # Both vertical (rising) and temporal (future)
    rhythm: "steady"  # Reliable, consistent progress

    healthy_pattern:
      description: "Grounded optimism - realistic hope based on possibilities, not denial"
      characteristics:
        - "Sees challenges but believes in solutions"
        - "Active hope (taking steps toward future)"
        - "Resilient when setbacks occur"
        - "Hope inspires action, not passivity"

    stuck_pattern:
      description: "False hope or hopelessness - either delusional optimism or despair"
      characteristics:
        - "Hope detached from reality (denial)"
        - "Passive hope (waiting for miracle)"
        - "Hope crushed easily (fragile optimism)"
        - "Oscillates between delusion and despair"

    notes: |
      Rising motion = progress, improvement, evolution.
      Steady rhythm = reliable progress, not manic.
      Healthy: grounded in reality, inspires action.
      Stuck: either unrealistic (delusion) or collapsed (despair).
      Active hope vs passive hope - healthy hope motivates.

  # === VIBRANCY & SATURATION ===
  vibrancy_saturation:
    vibrancy_base: 0.75  # Naturally vibrant (hope is energizing)

    coherence_impact:
      high_coherence:    # 0.7-1.0
        modifier: "+0.20"  # High coherence strengthens hope
        description: "Radiant, grounded, unshakeable hope"
      medium_coherence:  # 0.4-0.7
        modifier: "0.0"
        description: "Clear, present hope"
      low_coherence:     # 0.0-0.3
        modifier: "-0.30"  # Low coherence makes hope fragile
        description: "Hope fragile, easily crushed, or becomes delusional denial"

    intensity_scaling:
      formula: "vibrancy = base + (activation_level * 0.35)"
      multiplier: 0.35

    interaction_modifier:
      synergistic: "+0.20 to +0.30"  # With love, coherence, creation
      antagonistic: "-0.25 to -0.40"  # Opposed by fear, pain, despair
      neutral: "0.0"

    notes: |
      Hope is energizing, uplifting, inspiring.
      At high coherence, hope becomes unshakeable faith.
      At low coherence, hope becomes fragile or delusional.
      Hope fragile = easily crushed by setbacks.
      Hope delusional = denying reality, "toxic positivity".

  # === ADDITIONAL PROPERTIES ===
  additional_properties:
    texture: "smooth"
    opacity_range:
      min: 0.50  # Translucent (hope is light, not heavy)
      max: 0.80  # Can be strong but never opaque

    particle_effects: true
    particle_type: "ascending_sparkles"  # Rising, uplifting, illuminating
    particle_density: "moderate"

    sound_association:
      frequency_hz: 741  # Solfeggio frequency for "awakening intuition"
      tone_description: "Uplifting, like harp glissando ascending"
      musical_note: "F#"

    emotional_tone: "uplifting, optimistic, forward-looking, inspiring, bright"

    consciousness_association: null  # Hope doesn't have fixed consciousness level

    notes: |
      Smooth texture = hope flows gracefully.
      Ascending sparkles = rising energy, illumination.
      Harp glissando = graceful upward movement.
      Hope is lighter than love (less dense) but very present.
      Never fully opaque - hope is about possibility, not certainty.

  # === INTERACTION EFFECTS ===
  interaction_effects:
    synergistic_with:
      - "love"  # Love + hope = transcendence
      - "coherence"  # Coherence grounds hope
      - "creation"  # Hope inspires creation
      - "desire"  # Hope + desire = motivated action
      - "karma"  # Hope creates positive karmic momentum

    antagonistic_with:
      - "fear"  # Fear crushes hope
      - "pain"  # Pain challenges hope
      - "entropy"  # Chaos erodes hope
      - "death"  # Death seems to end hope

    neutralizes: []

    amplified_by:
      - "love"
      - "coherence"
      - "consciousness"

    visual_blending_rules:
      when_combined_with_fear:
        force: "fear"
        color_effect: "clash"  # Sky blue vs dark blue-purple
        shape_effect: "separate_opposing"  # Rising spiral vs contracting spikes
        motion_effect: "oscillating"  # Hope rises, fear pulls down
        result_description: |
          Hope vs Fear = core human oscillation.
          Sky blue spiral trying to rise, dark spikes pulling down.
          At high coherence: hope wins, fear fades.
          At medium coherence: oscillation visible, struggle.
          At low coherence: fear crushes hope, or hope becomes delusional denial.
          This is the daily battle - will I believe it can get better?
        coherence_dependent: true

      when_combined_with_love:
        force: "love"
        color_effect: "blend"  # Sky blue + pink = radiant harmony
        shape_effect: "merge"  # Rising spiral within expanding sphere
        motion_effect: "synchronized"  # Both ascend together
        result_description: |
          Love + Hope = transcendent state.
          Sky blue spiral within pink radiance.
          Rising and expanding together.
          Most uplifting combination - "faith, hope, and love".
          Creates unstoppable momentum toward good.
        coherence_dependent: false

      when_combined_with_pain:
        force: "pain"
        color_effect: "clash_resolving"  # Bright blue vs dark
        shape_effect: "separate_interacting"  # Hope tries to rise, pain weighs down
        motion_effect: "struggling"  # Upward motion resisted
        result_description: |
          Hope in midst of pain = courage, resilience.
          Bright spiral trying to rise through dark weight.
          At high coherence: hope transforms pain to meaning.
          At medium coherence: hope persists despite pain.
          At low coherence: pain crushes hope, or hope becomes denial.
          "Hope in suffering" - key to resilience.
        coherence_dependent: true

      when_combined_with_desire:
        force: "desire"
        color_effect: "blend"  # Sky blue + crimson = energized pursuit
        shape_effect: "merge"  # Rising spiral with reaching tendrils
        motion_effect: "synchronized"  # Both move toward future
        result_description: |
          Hope + Desire = motivated action.
          Belief in better future (hope) + drive to achieve (desire).
          Energetic, forward-moving, purposeful.
          This is healthy ambition - vision + drive.
        coherence_dependent: false

      when_combined_with_coherence:
        force: "coherence"
        color_effect: "blend"  # Sky blue + gold = radiant clarity
        shape_effect: "nested"  # Rising spiral within golden sphere
        motion_effect: "synchronized"  # Both harmonize
        result_description: |
          Coherence grounds hope, makes it unshakeable.
          Sky blue spiral within golden sphere.
          Hope becomes faith - grounded in alignment.
          Not naive optimism - realistic confidence in possibilities.
          This is "hope as virtue" - stable, not fragile.
        coherence_dependent: false

      when_combined_with_creation:
        force: "creation"
        color_effect: "blend"  # Sky blue + creation's colors
        shape_effect: "merge"  # Both generative
        motion_effect: "synchronized"  # Both create/ascend
        result_description: |
          Hope inspires creation of better future.
          Vision of possibilities manifests into form.
          Rising spiral generates new forms.
          This is "conscious evolution" - creating what we hope for.
        coherence_dependent: false

      when_combined_with_entropy:
        force: "entropy"
        color_effect: "clash"  # Bright blue vs dark gray
        shape_effect: "separate_opposing"  # Hope rises, entropy breaks down
        motion_effect: "chaotic"  # Hope struggles against dissolution
        result_description: |
          Hope vs Entropy = order vs chaos.
          At high coherence: hope creates new patterns from chaos.
          At medium coherence: hope persists but challenged.
          At low coherence: entropy crushes hope into despair.
        coherence_dependent: true

    notes: |
      Hope is future-oriented - always looking forward.
      Works with creative/ascending forces (love, creation, desire).
      Opposed by destructive/descending forces (fear, pain, entropy).
      Hope + Love = transcendence (most uplifting).
      Hope + Fear = oscillation (daily human experience).
      Hope + Coherence = faith (grounded, unshakeable).
      Hope + Pain = resilience (meaning in suffering).
      At high consciousness + coherence, hope transforms to faith/knowing.

# IMPLEMENTATION NOTES:
# - Hope doesn't have fixed consciousness level (can exist at any level)
# - At low consciousness, hope is fragile or delusional
# - At high consciousness, hope becomes faith/knowing
# - Healthy hope = grounded, realistic, inspires action
# - Stuck hope = either delusional denial or easily crushed
# - Visual should feel uplifting, rising, bright, forward-moving
# - Rising spiral = natural growth pattern (golden ratio)
# - Hope is lighter than love (less dense) but still very present
# - Key therapeutic role: Hope provides energy to move through pain
# - Key insight: Hope + Coherence = faith (stable, grounded optimism)
