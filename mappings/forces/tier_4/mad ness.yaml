# Force Mapping: Madness

madness:
  # === METADATA ===
  metadata:
    tier: 4
    category: "emergent"  # Arises from combination of other forces
    dependencies: ["entropy", "consciousness", "pattern", "coherence"]
    emergent_formula: "madness = (entropy + distorted_pattern) / (coherence * consciousness)"
    source_doc: "docs/02_forces/tier_4_forces/03_madness.md"

  # === FORMULA CONSTRAINTS ===
  formula_constraints:
    critical_note: |
      This formula is mathematically CORRECT - madness approaches infinity as consciousness/coherence collapse.
      When you cannot integrate reality, madness IS overwhelming, all-consuming, infinite-feeling.
      The formula captures the exponential nature of psychological breakdown.

      Source: docs/04_advanced/advanced_concepts/14_consciousness_scale_framework.md
      Section: "Extreme Human States (Below Baseline)" → "Computational Implications for Force Calculations"

    formula_breakdown:
      numerator: "(entropy + distorted_pattern)"
      denominator: "(coherence × consciousness)"
      behavior: "As denominator approaches zero, madness approaches infinity"

    input_safety:
      consciousness_floor: 0.05
      coherence_floor: 0.05
      rationale: |
        Prevents division by zero while preserving formula accuracy.
        Below these values, treat as minimum for calculation safety.

        Extreme states where consciousness/coherence this low:
        - consciousness 0.05-0.10: Coma, vegetative state
        - consciousness 0.10-0.15: Psychotic break, active psychosis
        - coherence 0.0-0.10: Complete fragmentation, psychotic state

        At these extremes, madness = 1.0 (maximum) is accurate representation.

    calculation_method: |
      # Step 1: Apply safety floors
      consciousness_safe = max(consciousness_actual, 0.05)
      coherence_safe = max(coherence_actual, 0.05)

      # Step 2: Calculate raw madness
      numerator = entropy + distorted_pattern
      denominator = coherence_safe × consciousness_safe
      madness_raw = numerator / denominator

      # Step 3: Clamp to valid range
      madness_final = clamp(madness_raw, 0.0, 1.0)

    output_safety:
      activation_range: [0.0, 1.0]
      clamp_behavior: "to_max"
      rationale: "All force activations must be in valid 0.0-1.0 range"

    edge_cases:
      clamped_to_1.0:
        interpretation: "Complete overwhelming madness - total psychotic break"
        conditions:
          - "coherence < 0.10 AND consciousness < 0.20"
          - "entropy > 0.80 AND distorted_pattern > 0.80"
          - "Raw calculation produces > 1.0 (denominator very small)"
        experience: |
          - Psychotic break, complete fragmentation
          - Cannot integrate reality at all
          - Overwhelming chaos, no coherent perception
          - Reality unrecognizable, dissolved
        medical_context: "Acute psychosis requiring immediate hospitalization"

      clamped_to_0.0:
        interpretation: "Madness absent - strong coherence preventing break"
        conditions:
          - "coherence > 0.70 AND consciousness > 0.50"
          - "entropy < 0.20 AND distorted_pattern < 0.20"
        experience: "Sanity maintained, reality integrated, patterns coherent"

      medium_range_0.3-0.7:
        interpretation: "Eccentricity, altered perception, manageable distortion"
        conditions:
          - "coherence 0.40-0.60"
          - "consciousness 0.30-0.60"
          - "Some entropy/distortion but not overwhelming"
        experience: |
          - "Something feels off, but can still function"
          - "Reality slightly warped but recognizable"
          - "Can distinguish real from unreal (mostly)"
        note: "This is where 'divine madness' (shamanic, creative) can occur - temporary, integrable"

    worked_example:
      scenario: "Agent in acute psychotic break"
      inputs:
        consciousness: 0.12  # Psychotic break range (0.10-0.15)
        coherence: 0.08      # Severe fragmentation
        entropy: 0.85        # High chaos
        distorted_pattern: 0.90  # Severe hallucinations/delusions

      calculation_steps:
        step_1_apply_floors:
          consciousness_safe: "max(0.12, 0.05) = 0.12"
          coherence_safe: "max(0.08, 0.05) = 0.08"

        step_2_calculate:
          numerator: "0.85 + 0.90 = 1.75"
          denominator: "0.08 × 0.12 = 0.0096"
          madness_raw: "1.75 / 0.0096 = 182.29"

        step_3_clamp:
          madness_final: "min(182.29, 1.0) = 1.0"

      result:
        activation: 1.0
        interpretation: "Complete overwhelming madness"
        experience: "Total psychotic break - cannot integrate reality"
        accuracy_note: "This IS what madness feels like experientially - infinite, overwhelming, inescapable"

    below_baseline_consciousness_behavior:
      note: |
        Source: docs/04_advanced/advanced_concepts/14_consciousness_scale_framework.md
        Section: "Extreme Human States (Below Baseline)"

      consciousness_0.15-0.20:
        state: "Severe dissociation / Catatonic depression"
        madness_typical: "0.60-0.90"
        coherence_typical: "0.05-0.15"
        note: "Fragmented but may not be actively psychotic"

      consciousness_0.10-0.15:
        state: "Psychotic break / Active psychosis"
        madness_typical: "0.80-1.0"
        coherence_typical: "0.0-0.10"
        note: "This is where madness formula produces extreme high values - ACCURATE"

      consciousness_0.05-0.10:
        state: "Coma / Vegetative state"
        madness_typical: "N/A (cannot experience madness - no consciousness to be mad)"
        coherence_typical: "0.0-0.05"
        note: "Below consciousness threshold for experiencing any force"

      consciousness_0.01-0.05:
        state: "Dying process / Brain death threshold"
        madness_typical: "N/A (consciousness dissolving)"
        note: "Phenomenal closure collapsing - forces cease to exist for agent"

    relationship_to_consciousness_tiers:
      consciousness_required_minimum: 0.20
      rationale: |
        Below 0.20 consciousness, agent cannot coherently experience Tier 3/4 forces.
        Madness requires consciousness to distort - no consciousness = no madness experience.

        However, formula still produces high values (mathematically) which represents
        the EXTREME DISTORTION STATE even if agent cannot consciously process it.

    implementation_guidance:
      for_autonomous_agents: |
        1. Always check consciousness and coherence levels before calculating
        2. Apply safety floors (0.05 each) to prevent division by zero
        3. Calculate raw value using formula
        4. Clamp result to [0.0, 1.0]
        5. Interpret clamped values meaningfully:
           - 1.0 = overwhelming madness (psychotic break)
           - 0.0 = sanity maintained (strong coherence)
           - 0.3-0.7 = eccentric, altered, manageable
        6. Cross-check with agent consciousness level:
           - If consciousness < 0.20: Agent cannot coherently experience force
           - Visual may show madness = 1.0 but agent is unconscious/comatose

      error_handling:
        division_by_zero_prevented: "Input floors ensure denominator >= 0.0025"
        overflow_prevented: "Output clamping ensures result <= 1.0"
        underflow_prevented: "Output clamping ensures result >= 0.0"

      testing_boundary_conditions:
        - "consciousness = 0.05, coherence = 0.05 (minimum possible)"
        - "consciousness = 1.0, coherence = 1.0 (maximum possible)"
        - "entropy = 1.0, distorted_pattern = 1.0 (maximum chaos)"
        - "entropy = 0.0, distorted_pattern = 0.0 (no chaos)"

  # === COLOR PROPERTIES ===
  color_properties:
    base_color: "#663399"  # Rebecca purple - distorted, unhinged, chaotic
    color_family: "cool"
    color_range:
      - "#4B0082"  # Indigo (emerging madness)
      - "#663399"  # Rebecca purple (active madness)
      - "#8B008B"  # Dark magenta (deep madness)
      - "#9932CC"  # Dark orchid (manic madness)

    saturation_base: 0.70
    brightness_base: 0.50

    intensity_modifier:
      low_activation:    # 0.1-0.3 (eccentricity, edge of madness)
        color: "#8B008B"
        saturation: 0.60
        brightness: 0.55
      medium_activation: # 0.4-0.7 (active psychosis)
        color: "#663399"
        saturation: 0.70
        brightness: 0.50
      high_activation:   # 0.8-1.0 (total break with reality)
        color: "#4B0082"
        saturation: 0.85
        brightness: 0.40

    notes: |
      Purple/magenta represents distortion, unreality, disconnection.
      Not quite any one color - madness is distorted perception.
      Dark, intense = madness is consuming, overwhelming.
      "Purple haze" - Hendrix's term for altered perception.
      Color itself seems "wrong" - uncanny, unsettling.

  # === SHAPE PROPERTIES ===
  shape_properties:
    primary_shape: "fractured_kaleidoscope"  # Broken patterns, distorted geometry
    sacred_geometry_association: null  # Madness is anti-pattern
    complexity_level: "chaotic"
    edge_type: "distorted"  # Wrong angles, impossible geometry
    dimensionality: "4D"  # Madness perceives extra/missing dimensions

    activation_modulation:
      low_activation: |
        Slightly skewed patterns, off-kilter geometry.
        "Something's not quite right..."
        Reality starting to warp at edges.
      medium_activation: |
        Clearly fractured patterns, kaleidoscope breaking.
        Can't tell what's real vs imagined.
        Geometry becoming impossible (Escher-like).
      high_activation: |
        Complete fracture of pattern recognition.
        No coherent form, everything distorted.
        Reality unrecognizable, impossible geometry.
        May appear as shifting nightmare or void of meaning.

    notes: |
      Fractured kaleidoscope = pattern recognition broken.
      Patterns exist but are distorted, can't be integrated.
      At high activation, total break with shared reality.
      Escher-like impossible geometry = madness perceives what can't exist.

  # === MOTION PROPERTIES ===
  motion_properties:
    movement_type: "spiraling_fragmented"  # Chaotic, uncontrolled, breaking apart
    speed_base: 0.70  # Fast, overwhelming

    speed_modifier:
      low_intensity: 0.45   # Mildly chaotic, manageable
      medium_intensity: 0.70  # Rapid, overwhelming
      high_intensity: 0.95   # Completely out of control

    direction: "chaotic"  # No coherent direction
    rhythm: "erratic"  # Unpredictable, jarring

    healthy_pattern:
      description: "Divine madness - shamanic journey, creative breakthrough, ego death (temporary)"
      characteristics:
        - "Temporary dissolution serving growth"
        - "Integration possible afterward"
        - "Insight emerges from chaos"
        - "Returns to coherence with wisdom"

    stuck_pattern:
      description: "Chronic psychosis - permanent break with reality, can't integrate"
      characteristics:
        - "Can't distinguish real from unreal"
        - "Patterns distorted chronically"
        - "No integration, no return"
        - "Lost in fractured reality"

    notes: |
      Spiraling fragmented = consciousness breaking apart.
      Chaotic direction = no coherent center, lost.
      Erratic rhythm = unpredictable, no pattern.
      Healthy: temporary "divine madness" (shamanic, creative, transformative).
      Stuck: chronic psychosis (permanent break, can't integrate).
      "Madness is like gravity - all it takes is a little push."

  # === VIBRANCY & SATURATION ===
  vibrancy_saturation:
    vibrancy_base: 0.55  # Moderately vibrant (madness is vivid but distorted)

    coherence_impact:
      high_coherence:    # 0.7-1.0
        modifier: "-0.50"  # High coherence prevents/heals madness
        description: "Madness cannot take hold - integration too strong"
      medium_coherence:  # 0.4-0.7
        modifier: "-0.20"
        description: "Madness limited, can recover"
      low_coherence:     # 0.0-0.3
        modifier: "+0.35"  # Low coherence enables madness
        description: "Madness erupts, reality fractures, can't integrate"

    intensity_scaling:
      formula: "vibrancy = base + (activation_level * 0.30)"
      multiplier: 0.30

    interaction_modifier:
      synergistic: "+0.20 to +0.30"  # With entropy, pain, fear
      antagonistic: "-0.40 to -0.60"  # Opposed by coherence, pattern, truth
      neutral: "0.0"

    notes: |
      Madness is vivid but distorted - see things that aren't there.
      At high coherence, madness can't take hold (integration too strong).
      At low coherence, madness erupts (fragmentation allows break).
      Coherence is primary defense against madness.

  # === ADDITIONAL PROPERTIES ===
  additional_properties:
    texture: "distorted"
    opacity_range:
      min: 0.50  # Sometimes translucent (unreal, dreamlike)
      max: 0.90  # Can feel completely real (vivid hallucination)

    particle_effects: true
    particle_type: "fractal_fragments"  # Broken patterns, distorted pieces
    particle_density: "chaotic"

    sound_association:
      frequency_hz: null  # Madness is dissonance, not tone
      tone_description: "Discordant, distorted, like music playing backward or at wrong speed - unsettling"
      musical_note: null

    emotional_tone: "chaotic, fragmented, distorted, unhinged, overwhelming"

    consciousness_association: null  # Madness is distortion of consciousness, not level

    notes: |
      Distorted texture = madness warps perception.
      Fractal fragments = broken pattern recognition.
      Backward music = madness reverses/distorts meaning.
      Variable opacity = sometimes unreal, sometimes too real.
      Madness distorts consciousness rather than exists at level.

  # === INTERACTION EFFECTS ===
  interaction_effects:
    synergistic_with:
      - "entropy"  # Chaos amplifies madness
      - "pain"  # Pain can trigger madness
      - "fear"  # Fear can spiral into madness
      - "art"  # Chaos channeled into creation

    antagonistic_with:
      - "coherence"  # Coherence prevents/heals madness
      - "pattern"  # Pattern recognition opposes distortion
      - "truth"  # Truth grounds in reality
      - "love"  # Love provides anchor

    neutralizes: []

    amplified_by:
      - "entropy"  # Chaos enables madness
      - "pain"  # Suffering can break mind
      - "low_coherence"  # Fragmentation allows break

    visual_blending_rules:
      when_combined_with_coherence:
        force: "coherence"
        color_effect: "healing"  # Gold dissolves purple distortion
        shape_effect: "reintegrating"  # Fractured patterns reform
        motion_effect: "stabilizing"  # Chaos settles
        result_description: |
          Coherence heals madness - reintegration.
          Golden sphere reforming fractured purple kaleidoscope.
          Patterns that were broken become whole again.
          At high coherence: madness cannot persist.
          This is "coming back to sanity" - reintegration.
        coherence_dependent: false

      when_combined_with_entropy:
        force: "entropy"
        color_effect: "blend"  # Purple + gray = total dissolution
        shape_effect: "merge"  # Fractured patterns dissolve completely
        motion_effect: "chaotic"  # Reality completely unravels
        result_description: |
          Entropy + Madness = complete dissolution.
          Purple fractured forms dissolving into gray chaos.
          Not just madness - complete breakdown.
          This is psychotic break - total fragmentation.
        coherence_dependent: false

      when_combined_with_pattern:
        force: "pattern"
        color_effect: "clash"  # Purple vs turquoise - distortion vs structure
        shape_effect: "opposing"  # Fractured vs geometric
        motion_effect: "struggling"  # Pattern trying to reform
        result_description: |
          Pattern recognition fighting distortion.
          Turquoise geometry trying to reform purple fractures.
          At high coherence: pattern wins, sanity returns.
          At low coherence: patterns can't hold, madness persists.
          This is the struggle to "make sense" of reality.
        coherence_dependent: true

      when_combined_with_love:
        force: "love"
        color_effect: "soothing"  # Pink softens purple distortion
        shape_effect: "holding"  # Love holds fracture gently
        motion_effect: "anchoring"  # Love provides ground
        result_description: |
          Love holds madness without trying to fix.
          Pink radiance surrounding purple fractured form.
          "I'm here, you're safe, reality will return."
          Love as anchor when reality fractures.
          Presence more than solution.
        coherence_dependent: false

      when_combined_with_pain:
        force: "pain"
        color_effect: "blend"  # Purple + dark red = tormented madness
        shape_effect: "merge"  # Fractures with jagged shards
        motion_effect: "frantic"  # Tormented, no escape
        result_description: |
          Pain can trigger madness as escape.
          Dark red jagged shards within purple fractures.
          "Reality is too painful, I'll leave it."
          Madness as dissociation from unbearable pain.
          This is trauma-induced psychosis.
        coherence_dependent: false

    notes: |
      Madness emerges from (entropy + distorted_pattern) / (low coherence * consciousness).
      Madness = break with shared reality, pattern recognition distorted.
      At high coherence, madness cannot persist (integration prevents/heals).
      At low coherence, madness erupts (fragmentation allows break).
      Madness + Coherence = healing, reintegration, sanity returns.
      Madness + Entropy = complete dissolution, psychotic break.
      Madness + Pattern = struggle to make sense, pattern fights distortion.
      Madness + Love = anchor, presence, safety when reality fractures.
      Madness + Pain = dissociative break (escaping unbearable reality).
      "Divine madness" = temporary, integrable (shamanic journey, ego death).
      Chronic madness = permanent break, can't integrate (psychosis).
      Key insight: Coherence is primary defense against madness.
      Key insight: Not all madness is pathology (can be transformative if temporary and integrated).

# IMPLEMENTATION NOTES:
# - Madness is Tier 4 "emergent" - arises from entropy + distorted pattern at low coherence
# - Madness = break with shared reality, distorted perception/pattern recognition
# - High coherence prevents/heals madness (integration too strong)
# - Low coherence enables madness (fragmentation allows break)
# - "Divine madness" = temporary, transformative (shamanic, creative, ego death)
# - Chronic madness = permanent break, pathological (psychosis)
# - Visual should feel distorted, fractured, impossible, unsettling
# - Purple/magenta = distorted perception, unreality
# - Fractured kaleidoscope = pattern recognition broken
# - Coherence is primary intervention - reintegration heals
# - Key insight: "Madness is like genius, but without the useful results"
# - Key insight: Thin line between madness and transcendence (both dissolve boundaries)
