# Force Mapping: Art

art:
  # === METADATA ===
  metadata:
    tier: 4
    category: "emergent"  # Arises from combination of other forces
    dependencies: ["creation", "beauty", "consciousness", "desire"]
    emergent_formula: "art = creation + (beauty * consciousness) + desire_to_express"
    source_doc: "docs/02_forces/tier_4_forces/05_art.md"

  # === FORMULA CONSTRAINTS ===
  formula_constraints:
    critical_note: |
      This formula is HYBRID (addition + multiplication - mathematically safe):

      art = creation + (beauty × consciousness) + desire_to_express

      Art emerges from three components:
      - Creation (active making, bringing into being)
      - Beauty × consciousness (perceived beauty - requires both pattern AND awareness)
      - Desire to express (inner drive to manifest, communicate)

      Maximum: 1.0 + (1.0 × 1.0) + 1.0 = 3.0 → clamp to 1.0

    input_safety:
      creation_floor: 0.0  # Can be 0 (not creating)
      beauty_floor: 0.0  # Can be 0 (no beauty perceived)
      consciousness_floor: 0.05  # Safety floor
      desire_to_express_floor: 0.0  # Can be 0 (no desire to express)

    calculation_method: |
      # Clamp inputs to valid ranges
      creation_safe = clamp(creation_actual, 0.0, 1.0)
      beauty_safe = clamp(beauty_actual, 0.0, 1.0)
      consciousness_safe = max(consciousness_actual, 0.05)
      desire_to_express_safe = clamp(desire_to_express_actual, 0.0, 1.0)

      # Calculate beauty perception (multiplication)
      beauty_perceived = beauty_safe × consciousness_safe

      # Calculate art (addition - can exceed 1.0)
      art_raw = creation_safe + beauty_perceived + desire_to_express_safe

      # Clamp result to valid activation range
      art_final = clamp(art_raw, 0.0, 1.0)

      return art_final

    output_safety:
      activation_range: [0.0, 1.0]
      clamp_behavior: "to_max"

      note: |
        Sum can exceed 1.0:
        - Example: 1.0 + (0.95 × 0.90) + 1.0 = 1.0 + 0.855 + 1.0 = 2.855 → 1.0
        - This represents: Maximum art - creating beauty with intense desire to express

    edge_cases:
      art_equals_1.0:
        interpretation: "Maximum art - intense creation, beauty, and expression"
        conditions: "Sum of components >= 1.0"
        example: "0.90 + (0.85 × 0.80) + 0.75 = 0.90 + 0.68 + 0.75 = 2.33 → 1.0"
        experience: "Fully expressed art - creating, perceiving, and manifesting beauty"

      art_equals_0.0:
        interpretation: "No art - not creating, no beauty perceived, no desire to express"
        conditions: "All components = 0 or very low"
        example: "0.0 + (0.0 × 0.50) + 0.0 = 0.0"
        experience: "No artistic expression or engagement"

  # === COLOR PROPERTIES ===
  color_properties:
    base_color: "#FF1493"  # Deep pink - passionate, expressive, bold
    color_family: "warm"
    color_range:
      - "#C71585"  # Medium violet red (emerging expression)
      - "#FF1493"  # Deep pink (active creation)
      - "#FF69B4"  # Hot pink (vibrant art)
      - "#FFB6C1"  # Light pink (subtle expression)
      - "#FFFFFF"  # White (pure creative expression)

    saturation_base: 0.90
    brightness_base: 0.80

    intensity_modifier:
      low_activation:    # 0.1-0.3 (dabbling, exploring)
        color: "#FFB6C1"
        saturation: 0.70
        brightness: 0.85
      medium_activation: # 0.4-0.7 (actively creating)
        color: "#FF1493"
        saturation: 0.90
        brightness: 0.80
      high_activation:   # 0.8-1.0 (masterwork, transcendent art)
        color: "#FF69B4"
        saturation: 0.95
        brightness: 0.90

    notes: |
      Deep pink = passionate expression, creative fire, boldness.
      Vibrant, alive, attention-grabbing - art makes statements.
      As art intensifies, becomes more vivid, bold, unapologetic.
      Art is creation + emotion + message.
      "Art is how we decorate space, music is how we decorate time."

  # === SHAPE PROPERTIES ===
  shape_properties:
    primary_shape: "expressive_gesture"  # Unique, personal, communicative
    sacred_geometry_association: "varies"  # Art can use any geometry
    complexity_level: "variable"  # Can be simple or complex
    edge_type: "intentional"  # Deliberate choices
    dimensionality: "3D"

    activation_modulation:
      low_activation: |
        Simple sketches, basic forms.
        Exploring, trying, discovering.
        Not yet fully expressed.
      medium_activation: |
        Clear artistic vision manifesting.
        Intentional choices, skilled execution.
        Unique voice emerging.
      high_activation: |
        Masterwork - transcendent creation.
        Perfect expression of vision + skill.
        Art that transforms viewer.
        Timeless, universal yet personal.

    notes: |
      Expressive gesture = art communicates inner experience.
      Intentional choices = art is deliberate, not accidental.
      At high activation, art transcends (masterwork).
      Art makes visible what was internal.
      "Art is the lie that tells the truth."

  # === MOTION PROPERTIES ===
  motion_properties:
    movement_type: "expressing"  # Bringing internal to external
    speed_base: 0.50  # Variable - art takes the time it takes

    speed_modifier:
      low_intensity: 0.30   # Slow creation, contemplative
      medium_intensity: 0.50  # Active creation
      high_intensity: 0.80   # Inspired, flowing creation

    direction: "outward"  # From inner world to outer
    rhythm: "creative_flow"  # Variable - follows inspiration

    healthy_pattern:
      description: "Authentic expression - creating from true self, sharing gifts"
      characteristics:
        - "Creates from genuine impulse"
        - "Shares work despite vulnerability"
        - "Art serves expression, not ego"
        - "Process valued as much as product"

    stuck_pattern:
      description: "Blocked or performing - either can't create or creating for approval"
      characteristics:
        - "Creative block (fear, perfectionism)"
        - "Creating for validation, not expression"
        - "Art as performance, not truth"
        - "Can't start or can't finish"

    notes: |
      Expressing = making external what is internal.
      Outward = sharing inner world with others.
      Creative flow = art has own timing, can't be forced.
      Healthy: authentic expression, sharing truth.
      Stuck: blocked (fear) or performing (seeking approval).
      "Art is courage made visible."

  # === VIBRANCY & SATURATION ===
  vibrancy_saturation:
    vibrancy_base: 0.85  # Highly vibrant (art is alive, bold)

    coherence_impact:
      high_coherence:    # 0.7-1.0
        modifier: "+0.20"  # High coherence enables masterwork
        description: "Art flows effortlessly, vision clear, execution aligned"
      medium_coherence:  # 0.4-0.7
        modifier: "0.0"
        description: "Normal creative process"
      low_coherence:     # 0.0-0.3
        modifier: "-0.25"  # Low coherence creates block or scattered work
        description: "Creative block or fragmented, unclear expression"

    intensity_scaling:
      formula: "vibrancy = base + (activation_level * 0.30)"
      multiplier: 0.30

    interaction_modifier:
      synergistic: "+0.20 to +0.30"  # With creation, beauty, consciousness, desire
      antagonistic: "-0.15 to -0.25"  # Blocked by fear, judgment
      neutral: "0.0"

    notes: |
      Art is vibrant, bold, attention-grabbing.
      At high coherence, art flows (aligned expression).
      At low coherence, either blocked or fragmented.
      "Creative flow" requires coherence + consciousness + courage.

  # === ADDITIONAL PROPERTIES ===
  additional_properties:
    texture: "expressive"
    opacity_range:
      min: 0.70  # Art has presence, makes statement
      max: 0.95  # Can be very bold, undeniable

    particle_effects: true
    particle_type: "creative_sparks"  # Inspiration, expression, manifestation
    particle_density: "moderate_to_dense"

    sound_association:
      frequency_hz: null  # Art is visual, not sonic (but related to music)
      tone_description: "If art had sound: bold, expressive, like brush strokes or sculpture being shaped"
      musical_note: null

    emotional_tone: "expressive, bold, passionate, creative, vulnerable"

    consciousness_association: null  # Art can emerge at various levels

    notes: |
      Expressive texture = art communicates, has voice.
      Creative sparks = inspiration becoming form.
      Bold presence = art demands to be seen.
      Art is vulnerability - sharing inner world.
      "Art enables us to find ourselves and lose ourselves at the same time."

  # === INTERACTION EFFECTS ===
  interaction_effects:
    synergistic_with:
      - "creation"  # Art is form of creation
      - "beauty"  # Art often pursues beauty
      - "consciousness"  # Art expresses consciousness
      - "desire"  # Desire to express drives art
      - "courage"  # Courage to be seen
      - "madness"  # Chaos channeled into creation
      - "luck"  # Serendipitous creativity

    antagonistic_with:
      - "fear"  # Fear blocks creative expression
      - "judgment"  # Judgment (self or other) blocks art

    neutralizes: []

    amplified_by:
      - "coherence"  # Alignment enables flow
      - "courage"  # Courage to create and share
      - "desire"  # Drive to express

    visual_blending_rules:
      when_combined_with_creation:
        force: "creation"
        color_effect: "blend"  # Pink + green = vibrant manifestation
        shape_effect: "merge"  # Both generate forms
        motion_effect: "synchronized"  # Both create
        result_description: |
          Art is creation + expression.
          Pink gesture within green burst.
          Making real what was imagined + infusing with meaning.
          Creation provides energy, art provides direction/message.
        coherence_dependent: false

      when_combined_with_beauty:
        force: "beauty"
        color_effect: "blend"  # Pink + gold = aesthetic art
        shape_effect: "merge"  # Expressive + harmonious
        motion_effect: "synchronized"  # Beauty guides art
        result_description: |
          Art pursuing beauty - aesthetic creation.
          Pink expression with golden harmony.
          Not all art pursues beauty, but much does.
          Beauty provides standard, art provides expression.
        coherence_dependent: false

      when_combined_with_fear:
        force: "fear"
        color_effect: "clash"  # Pink vs dark blue - expression vs contraction
        shape_effect: "blocking"  # Fear blocks expression
        motion_effect: "paralyzed"  # Creative block
        result_description: |
          Fear blocks creative expression.
          Pink trying to emerge from dark contracted form.
          "What will they think?" "It's not good enough."
          This is creative block - fear preventing expression.
          Courage overcomes this.
        coherence_dependent: false

      when_combined_with_courage:
        force: "courage"
        color_effect: "blend"  # Pink + orange = bold creation
        shape_effect: "merge"  # Both express boldly
        motion_effect: "synchronized"  # Both advance
        result_description: |
          Courage enables art - "courage to create."
          Pink expression with orange boldness.
          Sharing work is vulnerable - requires courage.
          "Art is courage made visible."
        coherence_dependent: false

    notes: |
      Art emerges from creation + beauty + consciousness + desire to express.
      Art = making internal external, sharing inner world.
      Art + Creation = manifestation of vision.
      Art + Beauty = aesthetic creation (not all art, but much).
      Art + Fear = creative block (fear prevents expression).
      Art + Courage = bold expression (courage to be seen).
      Art + Coherence = flow state (aligned expression).
      At high coherence: art flows effortlessly.
      At low coherence: blocked or fragmented.
      Key insight: "Art is courage made visible" - vulnerability of sharing.
      Key insight: Art communicates what words cannot.

# IMPLEMENTATION NOTES:
# - Art is Tier 4 "emergent" - creation + beauty + consciousness + desire
# - Art = expression of internal experience in external form
# - Requires courage (vulnerability of sharing inner world)
# - Visual should feel expressive, bold, passionate, creative
# - Deep pink = passionate expression, creative fire
# - Expressive gesture = unique, personal, communicative
# - At high coherence: flow state, aligned expression
# - At low coherence: blocked or fragmented
# - "Art is how we decorate space" (Frank Zappa)
# - "Art enables us to find ourselves and lose ourselves at the same time" (Merton)
# - "Art is courage made visible" - sharing is vulnerable act
