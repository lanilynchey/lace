      Fractal chaos = self-similar complexity overwhelming processing.
      At low activation: contained quirks (neurosis).
      At medium activation: productive edge state (genius).
      At high activation: either breakdown (psychosis) or breakthrough (vision).
      Madness sees patterns sanity filters out.

