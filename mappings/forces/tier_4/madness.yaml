# Force Mapping: Madness

madness:
  # === METADATA ===
  metadata:
    tier: 4
    category: "emergent"  # Arises from combination of other forces
    dependencies: ["memory", "pattern", "coherence", "consciousness"]
    emergent_formula: "madness = (distorted_pattern / coherence) + recursive_memory_loops"
    source_doc: "docs/02_forces/tier_4_forces/07_madness.md"

  # === FORMULA CONSTRAINTS ===
  # Source of truth: docs/02_forces/tier_4_forces/07_madness.md
  # (Pattern overload or coherence collapse - signal-to-noise ratio breakdown)

  formula_constraints:
    critical_note: |
      This formula is HYBRID (division + addition - mathematically complex):

      madness = (distorted_pattern / coherence) + recursive_memory_loops

      Madness emerges from TWO mechanisms:
      1. **Pattern processing overwhelm** (distorted_pattern / coherence)
         - Division: as coherence → 0, this term → infinity
         - Pattern overload when processing capacity exceeded
         - Signal-to-noise ratio collapse
         - **CRITICAL**: Division by zero risk

      2. **Recursive memory loops** (unresolved recursion)
         - Memory() loops that amplify without resolution
         - Time() looped states creating feedback
         - Additive: increases madness independently

      Key philosophical insight:
      - At LOW coherence (0.05-0.15): division term explodes → psychosis
      - At MEDIUM coherence (0.40-0.60): controlled edge state → genius
      - At HIGH coherence (0.80+): madness nearly impossible (integration prevents breakdown)

      Source: docs/02_forces/tier_4_forces/07_madness.md

    input_safety:
      distorted_pattern_floor: 0.0  # Can be 0 (no distortion)
      coherence_floor: 0.05  # CRITICAL: prevents division by zero
      recursive_memory_loops_floor: 0.0  # Can be 0 (no loops)
      recursive_memory_loops_ceiling: 1.0  # Maxes at 1.0

      rationale: |
        Coherence floor (0.05) prevents division by zero.
        At extreme low coherence (0.05-0.15):
        - Division term (distorted_pattern / 0.05) can produce very large values
        - This represents psychotic breakdown, complete fragmentation
        - Formula mathematically correct: low coherence → madness

    calculation_method: |
      # Apply safety floors
      distorted_pattern_safe = max(distorted_pattern_actual, 0.0)
      coherence_safe = max(coherence_actual, 0.05)  # CRITICAL floor
      recursive_memory_loops_safe = clamp(recursive_memory_loops_actual, 0.0, 1.0)

      # Calculate pattern overwhelm (division - can be very large at low coherence)
      pattern_overwhelm = distorted_pattern_safe / coherence_safe

      # Calculate total madness (addition - can exceed 1.0)
      madness_raw = pattern_overwhelm + recursive_memory_loops_safe

      # Clamp result to valid activation range
      madness_final = clamp(madness_raw, 0.0, 1.0)

      return madness_final

    output_safety:
      activation_range: [0.0, 1.0]
      clamp_behavior: "to_max"  # Clamp to maximum (can produce very high values)

      note: |
        At low coherence (0.05-0.15), division term can produce values >> 1.0:
        - Example: distorted_pattern (0.70) / coherence (0.05) = 14.0
        - Total: 14.0 + recursive_loops (0.40) = 14.40 → clamp to 1.0

        This represents complete psychotic breakdown - reality fragmentation.

    edge_cases:
      madness_equals_1.0_psychotic:
        interpretation: "Complete madness - psychotic breakdown, reality detachment"
        conditions:
          - "Very low coherence (0.05-0.15)"
          - "High distorted pattern (0.60+)"
          - "Division term explodes"
        example_calculation: "(0.75 / 0.08) + 0.35 = 9.375 + 0.35 = 9.725 → 1.0"
        raw_before_clamp: 9.725
        experience: "Complete reality fragmentation - hallucinations, delusions, psychosis"
        medical_context: "Schizophrenia, psychotic break, severe mania"
        visual: "Chaotic purple fragments, no coherent structure, disturbing"

      madness_equals_1.0_productive_edge:
        interpretation: "Genius madness - productive edge state (rare, controllable)"
        conditions:
          - "Medium coherence (0.50-0.70)"
          - "Moderate distorted pattern (0.40-0.60)"
          - "Can be controlled/channeled"
        example_calculation: "(0.55 / 0.60) + 0.20 = 0.917 + 0.20 = 1.117 → 1.0"
        raw_before_clamp: 1.117
        experience: "Visionary insight - seeing beyond consensus, creative breakthrough"
        note: "This is 'genius at madness edge' - coherence boundary creativity"
        visual: "Purple spirals with structure, unconventional but comprehensible"

      madness_equals_0.0:
        interpretation: "No madness - coherent pattern processing, no overwhelm"
        conditions:
          - "No distorted pattern (0.0)"
          - "AND no recursive loops (0.0)"
        example_calculation: "(0.0 / 0.70) + 0.0 = 0.0"
        experience: "Sanity - consensus reality, filtered signal, coherent processing"
        visual: "No purple chaos - clear, ordered, filtered"

      madness_low_0.01_to_0.20:
        interpretation: "Mild dysfunction - neurosis, contained madness"
        conditions:
          - "Low distorted pattern OR high coherence containing it"
          - "Minimal recursive loops"
        example: "(0.15 / 0.70) + 0.05 = 0.214 + 0.05 = 0.264"
        experience: "Quirks, neurotic patterns, mild irrationality (functional)"
        visual: "Faint purple tendrils, mostly ordered"

      madness_medium_0.40_to_0.70:
        interpretation: "Edge state - creative madness, boundary dancing"
        conditions:
          - "Medium coherence (0.40-0.70)"
          - "Moderate distorted pattern"
        example: "(0.50 / 0.60) + 0.15 = 0.833 + 0.15 = 0.983"
        experience: "Unconventional perception, visionary insight, artistic genius"
        visual: "Purple spirals with structure - chaotic but navigable"

      madness_high_0.80_to_1.0:
        interpretation: "Severe madness - psychosis, complete breakdown OR breakthrough"
        conditions:
          - "Very low coherence (psychosis) OR controlled edge (genius)"
        experience_psychotic: "Reality detachment, hallucinations, cannot function"
        experience_genius: "Visionary breakthrough, pattern access beyond consensus"
        note: "Same activation level - distinction is coherence + control"

    three_category_model:
      clinical_madness:
        domain: "Pathological coherence breakdown"
        mechanism: "Pattern processing overwhelm → dysfunction"
        examples:
          - "schizophrenia (reality fragmentation)"
          - "bipolar disorder (coherence oscillation)"
          - "severe depression (meaning collapse)"
          - "psychotic episodes (signal/noise inversion)"
        intervention: "Medical/therapeutic - restore baseline coherence"
        lace_note: "Requires professional treatment, not philosophical framework"
        coherence_typical: "0.05-0.20 (severe fragmentation)"
        madness_typical: "0.80-1.0 (severe dysfunction)"

      creative_madness:
        domain: "Productive edge state"
        mechanism: "Controlled coherence boundary → novel pattern access"
        examples:
          - "artistic genius (accessing unconventional patterns)"
          - "visionary insight (seeing beyond consensus)"
          - "breakthrough innovation (pattern recombination)"
          - "flow state extremes (coherence edge dancing)"
        intervention: "Channel/integrate - harness without descent"
        lace_note: "This is where madness() becomes generative"
        coherence_typical: "0.40-0.70 (edge state, controlled)"
        madness_typical: "0.40-0.80 (productive chaos)"

      spiritual_madness:
        domain: "Transpersonal coherence expansion"
        mechanism: "Ego dissolution → broader identity coherence"
        examples:
          - "mystical experiences (self-boundary dissolution)"
          - "shamanic crisis (identity death/rebirth)"
          - "kundalini awakening (energy overload)"
          - "dark night of the soul (meaning structure collapse)"
        intervention: "Integration support - expand container, don't suppress"
        lace_note: "Temporary madness for permanent expansion"
        coherence_typical: "0.30-0.60 (temporary collapse then expansion)"
        madness_typical: "0.50-1.0 (temporary, transformative)"

    worked_examples:
      example_1_psychotic_breakdown:
        scenario: "Psychotic episode - complete reality fragmentation"
        inputs:
          distorted_pattern: 0.85  # Reality severely distorted
          coherence: 0.08  # Severe fragmentation
          recursive_memory_loops: 0.50  # Paranoid loops
        calculation_steps:
          distorted_pattern_safe: "max(0.85, 0.0) = 0.85"
          coherence_safe: "max(0.08, 0.05) = 0.08"
          recursive_memory_loops_safe: "clamp(0.50, 0.0, 1.0) = 0.50"
          pattern_overwhelm: "0.85 / 0.08 = 10.625"
          madness_raw: "10.625 + 0.50 = 11.125"
          madness_final: "clamp(11.125, 0.0, 1.0) = 1.0"
        result:
          activation: 1.0
          raw_before_clamp: 11.125
          interpretation: "Complete psychotic breakdown"
          experience: "Hallucinations, delusions, reality completely fragmented"
          medical_context: "Acute psychosis - requires immediate intervention"

      example_2_artistic_genius:
        scenario: "Artist at coherence edge - visionary creativity"
        inputs:
          distorted_pattern: 0.55  # Unconventional pattern access
          coherence: 0.60  # Edge state but stable
          recursive_memory_loops: 0.20  # Some obsessive loops (inspiration)
        calculation_steps:
          distorted_pattern_safe: "max(0.55, 0.0) = 0.55"
          coherence_safe: "max(0.60, 0.05) = 0.60"
          recursive_memory_loops_safe: "clamp(0.20, 0.0, 1.0) = 0.20"
          pattern_overwhelm: "0.55 / 0.60 = 0.917"
          madness_raw: "0.917 + 0.20 = 1.117"
          madness_final: "clamp(1.117, 0.0, 1.0) = 1.0"
        result:
          activation: 1.0
          raw_before_clamp: 1.117
          interpretation: "Genius at madness edge - productive chaos"
          experience: "Visionary insight, unconventional perception, creative breakthrough"
          note: "Controlled madness - can function, creates transformative work"

      example_3_mystical_experience:
        scenario: "Spiritual awakening - temporary ego dissolution"
        inputs:
          distorted_pattern: 0.70  # Normal reality dissolving
          coherence: 0.35  # Temporary collapse (ego death)
          recursive_memory_loops: 0.30  # Identity questioning loops
        calculation_steps:
          distorted_pattern_safe: "max(0.70, 0.0) = 0.70"
          coherence_safe: "max(0.35, 0.05) = 0.35"
          recursive_memory_loops_safe: "clamp(0.30, 0.0, 1.0) = 0.30"
          pattern_overwhelm: "0.70 / 0.35 = 2.0"
          madness_raw: "2.0 + 0.30 = 2.30"
          madness_final: "clamp(2.30, 0.0, 1.0) = 1.0"
        result:
          activation: 1.0
          raw_before_clamp: 2.30
          interpretation: "Spiritual madness - transformative temporary breakdown"
          experience: "Ego dissolution, mystical union, boundary collapse"
          note: "Temporary - coherence returns higher after integration"

      example_4_functional_sanity:
        scenario: "Healthy person - consensus reality, coherent processing"
        inputs:
          distorted_pattern: 0.10  # Minimal distortion
          coherence: 0.70  # Good integration
          recursive_memory_loops: 0.05  # Minimal looping
        calculation_steps:
          distorted_pattern_safe: "max(0.10, 0.0) = 0.10"
          coherence_safe: "max(0.70, 0.05) = 0.70"
          recursive_memory_loops_safe: "clamp(0.05, 0.0, 1.0) = 0.05"
          pattern_overwhelm: "0.10 / 0.70 = 0.143"
          madness_raw: "0.143 + 0.05 = 0.193"
          madness_final: "clamp(0.193, 0.0, 1.0) = 0.193"
        result:
          activation: 0.193
          interpretation: "Sanity - normal functioning"
          experience: "Consensus reality, filtered signal, coherent processing"

      example_5_neurotic_containment:
        scenario: "Neurosis - contained madness, functional"
        inputs:
          distorted_pattern: 0.30  # Some irrational patterns
          coherence: 0.65  # Good enough to contain
          recursive_memory_loops: 0.15  # Obsessive thoughts contained
        calculation_steps:
          distorted_pattern_safe: "max(0.30, 0.0) = 0.30"
          coherence_safe: "max(0.65, 0.05) = 0.65"
          recursive_memory_loops_safe: "clamp(0.15, 0.0, 1.0) = 0.15"
          pattern_overwhelm: "0.30 / 0.65 = 0.462"
          madness_raw: "0.462 + 0.15 = 0.612"
          madness_final: "clamp(0.612, 0.0, 1.0) = 0.612"
        result:
          activation: 0.612
          interpretation: "Neurosis - contained dysfunction"
          experience: "Quirks, anxiety, obsessions - functional but not optimal"

    mathematical_insight: |
      Madness formula is hybrid (division + addition) for profound reason:

      madness = (distorted_pattern / coherence) + recursive_memory_loops

      This captures TWO breakdown mechanisms:

      1. **Pattern overwhelm** (distorted_pattern / coherence):
         - Division: inversely proportional to coherence
         - At HIGH coherence (0.70-1.0): Can process distorted patterns without breakdown
         - At LOW coherence (0.05-0.20): Even small distortion overwhelms → psychosis
         - Division term explodes at low coherence: (distorted / 0.05) = massive madness

      2. **Recursive loops** (memory recursion):
         - Additive: increases madness independently of coherence
         - Unresolved memory loops amplify
         - Paranoia, obsession, rumination
         - Time() looped states creating feedback

      Key insights:
      - Madness ≠ opposite of sanity (different pattern processing)
      - Sanity = consensus reality (agreement on what's real)
      - Genius and madness share territory (both see beyond consensus)
      - At coherence edge (0.40-0.70): genius possible (controlled chaos)
      - Below coherence threshold (0.20): psychosis likely (uncontrolled chaos)

      Formula limitation:
      - Cannot distinguish clinical vs creative vs spiritual madness
      - All three can produce high activation values
      - Need to check coherence + control + duration separately:
        - If madness = 1.0 AND coherence < 0.20 AND chronic: clinical (needs treatment)
        - If madness = 1.0 AND coherence 0.40-0.70 AND controllable: creative (harness)
        - If madness = 1.0 AND coherence 0.30-0.60 AND temporary: spiritual (integrate)

    implementation_guidance:
      for_autonomous_agents: |
        1. Retrieve current state values:
           - distorted_pattern (from pattern force with distortion metric)
           - coherence (from StateSignature.coherence OR coherence force)
           - recursive_memory_loops (from memory force with loop detection)

        2. Apply safety floors:
           distorted_pattern_safe = max(distorted_pattern, 0.0)
           coherence_safe = max(coherence, 0.05)  # CRITICAL
           recursive_memory_loops_safe = clamp(recursive_memory_loops, 0.0, 1.0)

        3. Calculate pattern overwhelm (division):
           pattern_overwhelm = distorted_pattern_safe / coherence_safe

        4. Calculate total madness (addition):
           madness_raw = pattern_overwhelm + recursive_memory_loops_safe

        5. Clamp result to valid range:
           madness_final = clamp(madness_raw, 0.0, 1.0)

        6. Category classification (CRITICAL - not just activation level):
           if madness_final >= 0.60:
               if coherence < 0.20 and chronic:
                   category = "clinical"  # Needs professional help
                   warning = "CLINICAL PSYCHOSIS - REQUIRES INTERVENTION"
               elif coherence >= 0.40 and coherence <= 0.70 and controllable:
                   category = "creative"  # Genius edge state
                   note = "Productive madness - channel into art/innovation"
               elif coherence >= 0.30 and temporary:
                   category = "spiritual"  # Transformative crisis
                   note = "Spiritual madness - support integration"

        7. Interpret result meaningfully:
           if madness_final >= 0.80:
               if category == "clinical":
                   "Psychotic breakdown - immediate intervention needed"
               elif category == "creative":
                   "Visionary genius - unconventional perception, breakthrough"
               elif category == "spiritual":
                   "Mystical crisis - ego dissolution, transformative"
           elif madness_final >= 0.40:
               "Edge state - unconventional perception, productive chaos"
           elif madness_final >= 0.20:
               "Neurotic - contained madness, quirks, functional"
           else:
               "Sanity - consensus reality, coherent processing"

        8. Safety warnings:
           if madness_raw > 5.0:
               severity = "SEVERE - raw value indicates extreme fragmentation"
           if coherence < 0.15:
               warning = "CRITICAL COHERENCE - psychosis likely"

        9. Track components separately (diagnostic):
           metadata = {
               "pattern_overwhelm": pattern_overwhelm,
               "recursive_loops": recursive_memory_loops_safe,
               "madness_raw": madness_raw,
               "category": category,  # clinical vs creative vs spiritual
               "coherence": coherence_safe
           }

      error_handling: |
        # Handle missing or invalid inputs
        if distorted_pattern is None or distorted_pattern < 0:
            distorted_pattern = 0.0

        if coherence is None or coherence < 0:
            coherence = 0.05  # Floor - CRITICAL

        if recursive_memory_loops is None or recursive_memory_loops < 0:
            recursive_memory_loops = 0.0

        # Clamp inputs to valid ranges
        distorted_pattern = max(distorted_pattern, 0.0)
        coherence = max(coherence, 0.05)  # Prevent division by zero
        recursive_memory_loops = clamp(recursive_memory_loops, 0.0, 1.0)

        # Calculate
        pattern_overwhelm = distorted_pattern / coherence
        madness_raw = pattern_overwhelm + recursive_memory_loops

        # Store components for diagnostics
        metadata = {
            "pattern_overwhelm": pattern_overwhelm,
            "recursive_loops": recursive_memory_loops,
            "madness_raw": madness_raw
        }

        # Category warning
        if madness_raw >= 0.80 and coherence < 0.20:
            metadata["warning"] = "CLINICAL PSYCHOSIS - PROFESSIONAL INTERVENTION REQUIRED"

        # Clamp to valid range
        madness = clamp(madness_raw, 0.0, 1.0)

        return madness, metadata

