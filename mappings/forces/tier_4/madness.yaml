      characteristics:
        - "Reality detachment (hallucinations, delusions)"
        - "Cannot integrate, cannot function"
        - "Chronic rumination, obsession (neurosis)"
        - "Madness consumes, no control"

    notes: |
      Recursive spiraling = patterns looping back on themselves.
      Inward direction = madness is self-referential, internal.
      Chaotic rhythm = madness is unpredictable, non-linear.
      Healthy: controlled edge state, temporary, channeled.
      Stuck: psychotic breakdown, chronic dysfunction.
      "Genius and madness are but different manifestations."

