# Force Mapping: Music

music:
  # === METADATA ===
  metadata:
    tier: 4
    category: "emergent"  # Arises from combination of other forces
    dependencies: ["pattern", "time", "beauty", "consciousness"]
    emergent_formula: "music = (pattern + beauty) * time"
    source_doc: "docs/02_forces/tier_4_forces/06_music.md"

  # === FORMULA CONSTRAINTS ===
  formula_constraints:
    critical_note: |
      This formula is HYBRID (addition then multiplication - mathematically safe):

      music = (pattern + beauty) × time

      Music emerges from pattern and beauty unfolding through time:
      - Pattern (rhythm, structure, repetition)
      - Beauty (harmony, melody, resonance)
      - Time (temporal unfolding - music exists IN time)

      Maximum: (1.0 + 1.0) × 1.0 = 2.0 → clamp to 1.0

    input_safety:
      pattern_floor: 0.0  # Can be 0 (no pattern = noise)
      beauty_floor: 0.0  # Can be 0 (no beauty = unpleasant sound)
      time_floor: 0.0  # Can be 0 (no temporal unfolding = static)

    calculation_method: |
      # Clamp inputs to valid ranges
      pattern_safe = clamp(pattern_actual, 0.0, 1.0)
      beauty_safe = clamp(beauty_actual, 0.0, 1.0)
      time_safe = clamp(time_actual, 0.0, 1.0)

      # Calculate pattern + beauty (can be 0.0 to 2.0)
      musical_content = pattern_safe + beauty_safe

      # Multiply by time (music unfolds through time)
      music_raw = musical_content × time_safe

      # Clamp result to valid activation range
      music_final = clamp(music_raw, 0.0, 1.0)

      return music_final

    output_safety:
      activation_range: [0.0, 1.0]
      clamp_behavior: "to_max"

      note: |
        Formula can produce values up to 2.0:
        - Example: (1.0 + 1.0) × 1.0 = 2.0 → clamp to 1.0
        - This represents: Perfect music - maximum pattern, beauty, and temporal unfolding

    edge_cases:
      music_equals_1.0:
        interpretation: "Perfect music - maximum pattern, beauty, and time"
        conditions: "(pattern + beauty) × time >= 1.0"
        example: "(0.90 + 0.85) × 0.70 = 1.75 × 0.70 = 1.225 → 1.0"
        experience: "Transcendent music - perfect harmony, rhythm, beauty unfolding in time"

      music_equals_0.0:
        interpretation: "No music - no pattern, no beauty, OR no temporal unfolding"
        conditions: "pattern = 0 AND beauty = 0, OR time = 0"
        example_1: "(0.0 + 0.0) × 0.70 = 0.0"
        example_2: "(0.80 + 0.60) × 0.0 = 0.0"
        experience: "Silence, noise, or static (no musical quality)"

  # === COLOR PROPERTIES ===
  color_properties:
    base_color: "#9370DB"  # Medium purple - rhythmic, flowing, emotional
    color_family: "cool"
    color_range:
      - "#8A2BE2"  # Blue violet (rhythmic)
      - "#9370DB"  # Medium purple (melodic)
      - "#DDA0DD"  # Plum (harmonic)
      - "#E6E6FA"  # Lavender (transcendent music)
      - "#FFFFFF"  # White (pure sound, silence)

    saturation_base: 0.65
    brightness_base: 0.75

    intensity_modifier:
      low_activation:    # 0.1-0.3 (background, ambient)
        color: "#DDA0DD"
        saturation: 0.50
        brightness: 0.80
      medium_activation: # 0.4-0.7 (active listening, playing)
        color: "#9370DB"
        saturation: 0.65
        brightness: 0.75
      high_activation:   # 0.8-1.0 (transcendent, overwhelming)
        color: "#E6E6FA"
        saturation: 0.75
        brightness: 0.95

    notes: |
      Purple = emotional, flowing, temporal art form.
      Music exists in time - it's pattern flowing temporally.
      As music intensifies, becomes lighter, more ethereal.
      At highest levels, approaches silence/white - transcendent.
      "Music is the space between the notes" - Miles Davis.

  # === SHAPE PROPERTIES ===
  shape_properties:
    primary_shape: "flowing_waves"  # Sound waves, temporal patterns
    sacred_geometry_association: "wave_interference_patterns"  # Harmonics, resonance
    complexity_level: "elegant"  # Can be simple or complex
    edge_type: "flowing"  # Music has no hard edges
    dimensionality: "4D"  # Music exists in time

    activation_modulation:
      low_activation: |
        Simple waves, basic rhythm.
        Ambient, background presence.
        Gentle flow.
      medium_activation: |
        Complex wave patterns, clear melody/harmony.
        Interference patterns visible (harmonics).
        Engaging, draws attention.
      high_activation: |
        Transcendent wave patterns, perfect harmony.
        All frequencies in perfect resonance.
        Music that transforms consciousness.
        May appear as pure vibration or mandala of sound.

    notes: |
      Flowing waves = sound waves, vibrational patterns.
      Interference patterns = harmonics (multiple frequencies resonating).
      At high activation, music becomes transcendent.
      Music is temporal art - exists only while playing.
      "Music is the universal language of mankind."

  # === MOTION PROPERTIES ===
  motion_properties:
    movement_type: "flowing_rhythmic"  # Temporal, pulsing, melodic
    speed_base: 0.60  # Moderate - variable by tempo

    speed_modifier:
      low_intensity: 0.30   # Largo, adagio (slow)
      medium_intensity: 0.60  # Andante, moderato (medium)
      high_intensity: 0.90   # Allegro, presto (fast)

    direction: "temporal"  # Forward through time
    rhythm: "varies"  # Different rhythms, tempos, time signatures

    healthy_pattern:
      description: "Expressive flow - music as emotional expression and connection"
      characteristics:
        - "Music expresses what words cannot"
        - "Creates resonance, connection"
        - "Moves emotions, transforms states"
        - "Shared experience, universal language"

    stuck_pattern:
      description: "Performance anxiety or disconnection - either paralyzed or mechanical"
      characteristics:
        - "Music as performance, not expression"
        - "Technical perfection, no soul"
        - "Or: fear prevents playing/singing"
        - "Music as commodity, not connection"

    notes: |
      Flowing rhythmic = music moves through time with pattern.
      Temporal direction = music unfolds, can't be static.
      Variable rhythm = different musical styles, tempos.
      Healthy: music as expression, connection, transformation.
      Stuck: performance (technical, no soul) or blocked (fear).
      "Music is what feelings sound like."

  # === VIBRANCY & SATURATION ===
  vibrancy_saturation:
    vibrancy_base: 0.75  # Naturally vibrant (music is alive, moving)

    coherence_impact:
      high_coherence:    # 0.7-1.0
        modifier: "+0.20"  # High coherence reveals music's transcendent quality
        description: "Music deeply felt, transformative, transcendent"
      medium_coherence:  # 0.4-0.7
        modifier: "0.0"
        description: "Music appreciated, enjoyed"
      low_coherence:     # 0.0-0.3
        modifier: "-0.20"  # Low coherence makes music background noise
        description: "Music is noise, can't appreciate, disconnected"

    intensity_scaling:
      formula: "vibrancy = base + (activation_level * 0.30)"
      multiplier: 0.30

    interaction_modifier:
      synergistic: "+0.20 to +0.30"  # With pattern, time, beauty, consciousness
      antagonistic: "-0.15 to -0.25"  # Disrupted by entropy, chaos
      neutral: "0.0"

    notes: |
      Music is naturally vibrant, emotionally moving.
      At high coherence, music is transcendent (deeply felt).
      At low coherence, music becomes noise (can't appreciate).
      Music requires coherence to be truly heard.

  # === ADDITIONAL PROPERTIES ===
  additional_properties:
    texture: "flowing"
    opacity_range:
      min: 0.40  # Music is ephemeral, temporal
      max: 0.80  # Can be very present but never solid

    particle_effects: true
    particle_type: "sound_waves"  # Vibrational, resonant, flowing
    particle_density: "moderate"

    sound_association:
      frequency_hz: "all"  # Music contains all frequencies
      tone_description: "Literally music - melody, harmony, rhythm, all musical elements"
      musical_note: "all"

    emotional_tone: "flowing, rhythmic, emotional, resonant, temporal"

    consciousness_association: null  # Music can be experienced at various levels

    notes: |
      Flowing texture = music moves, flows, evolves.
      Sound waves = literal representation (music is vibration).
      Never fully solid = music is temporal, exists only while playing.
      Music IS sound - this force embodies sonic experience.
      "Music is the shorthand of emotion" - Tolstoy.

  # === INTERACTION EFFECTS ===
  interaction_effects:
    synergistic_with:
      - "pattern"  # Music is temporal pattern
      - "time"  # Music exists in time
      - "beauty"  # Music often pursues beauty
      - "consciousness"  # Music affects consciousness
      - "love"  # Music expresses love

    antagonistic_with:
      - "entropy"  # Chaos disrupts musical pattern

    neutralizes: []

    amplified_by:
      - "pattern"  # Pattern IS music (temporal structure)
      - "coherence"  # Coherence allows deep listening
      - "consciousness"  # Awareness perceives music deeply

    visual_blending_rules:
      when_combined_with_pattern:
        force: "pattern"
        color_effect: "blend"  # Purple + turquoise = temporal pattern
        shape_effect: "merge"  # Waves following fractal patterns
        motion_effect: "synchronized"  # Perfect rhythm
        result_description: |
          Pattern through time = Music.
          Purple waves flowing in turquoise geometric patterns.
          Rhythm, melody, harmony all as temporal patterns.
          Music is mathematics made audible.
        coherence_dependent: false

      when_combined_with_time:
        force: "time"
        color_effect: "blend"  # Purple + silver = music in time
        shape_effect: "flowing_through"  # Waves flowing through stream
        motion_effect: "temporal"  # Music unfolds
        result_description: |
          Music decorates time (Zappa).
          Purple waves flowing through silver stream.
          Music exists only while playing - temporal art.
          "Music is how we decorate time."
        coherence_dependent: false

      when_combined_with_consciousness:
        force: "consciousness"
        color_effect: "blend"  # Purple + lavender = music affecting consciousness
        shape_effect: "nested"  # Music within awareness
        motion_effect: "transforming"  # Music changes states
        result_description: |
          Music transforms consciousness directly.
          Purple waves within lavender sphere.
          Music bypasses thought, affects emotion/state directly.
          "Music is a higher revelation than all wisdom and philosophy."
        coherence_dependent: false

      when_combined_with_love:
        force: "love"
        color_effect: "blend"  # Purple + pink = music of love
        shape_effect: "merge"  # Both flow, radiate
        motion_effect: "synchronized"  # Resonating together
        result_description: |
          Music expresses love directly.
          Purple-pink flowing waves.
          Love songs, lullabies, expressions of connection.
          Music as universal language of heart.
        coherence_dependent: false

    notes: |
      Music emerges from (pattern + beauty) * time.
      Music = temporal art form, pattern flowing through time.
      Music + Pattern = rhythm, melody, harmony (temporal structures).
      Music + Time = music exists only while playing (temporal).
      Music + Consciousness = music transforms states directly.
      Music + Love = music expresses emotion, connection.
      At high coherence: music deeply felt, transcendent.
      At low coherence: music becomes noise, can't appreciate.
      Key insight: "Music is pattern made temporal and audible."
      Key insight: Music bypasses thought, affects emotion/state directly.

# IMPLEMENTATION NOTES:
# - Music is Tier 4 "emergent" - (pattern + beauty) * time
# - Music = temporal art form, exists only while playing
# - Pattern through time = rhythm, melody, harmony
# - Visual should feel flowing, rhythmic, temporal, emotional
# - Purple = emotional, flowing, temporal quality
# - Flowing waves = sound waves, vibrational patterns
# - At high coherence: music transcendent, deeply felt
# - At low coherence: music is noise, can't appreciate
# - "Music is how we decorate time" - Frank Zappa
# - "Music is the space between the notes" - Miles Davis
# - "Music is a higher revelation than all wisdom and philosophy" - Beethoven
