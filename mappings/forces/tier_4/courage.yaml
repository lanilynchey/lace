      At high coherence: courage is grounded, wise, steady.
      At low coherence: courage is fragile, reckless, or false bravado.
      Key insight: "Courage is not absence of fear, but action despite it."
      Key insight: Courage is threshold - below = fear dominates, at/above = can act.

