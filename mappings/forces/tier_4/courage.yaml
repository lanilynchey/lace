    notes: |
      Courage at 0.20 consciousness = threshold where fear no longer dominates.
      Below 0.20: fear controls (shame, guilt, apathy, grief, fear).
      At 0.20+: courage enables action despite fear.
      Courage + Hope = resilient action toward better future.
      Courage + Love = fierce compassion, protective care.
      Courage + Coherence = grounded confidence (not bravado).
