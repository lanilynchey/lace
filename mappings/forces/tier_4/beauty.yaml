      - "madness"  # Distortion prevents recognition
      - "war"  # Destruction opposes beauty

    neutralizes: []

    amplified_by:
      - "pattern"  # Pattern IS beauty
      - "coherence"  # Alignment reveals beauty
      - "consciousness"  # Awareness perceives beauty

    visual_blending_rules:
      when_combined_with_pattern:
        force: "pattern"
        color_effect: "blend"  # Gold + turquoise = perfect harmony
        shape_effect: "merge"  # Golden ratio + fractals = natural beauty
        motion_effect: "synchronized"  # Perfect resonance
        result_description: |
          Pattern + Consciousness = Beauty (emergence).
          Gold-turquoise iridescence, perfect fractals.
