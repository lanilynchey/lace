          Sacred geometry fully expressed.
          "Beauty is pattern at highest recognition."
        coherence_dependent: false

      when_combined_with_coherence:
        force: "coherence"
        color_effect: "amplify"  # Gold + gold = radiant perfection
        shape_effect: "perfecting"  # All proportions ideal
        motion_effect: "harmonious"  # Perfect flow
        result_description: |
          Coherence amplifies beauty to sublime.
          Radiant golden perfection, transcendent.
          Beauty becomes overwhelming in best way.
          This is the sublime - beauty that awes.
        coherence_dependent: false

      when_combined_with_consciousness:
        force: "consciousness"
        color_effect: "blend"  # Gold + lavender = perceived beauty
        shape_effect: "revealing"  # Consciousness sees pattern
        motion_effect: "witnessing"  # Beauty perceived
        result_description: |
          Consciousness perceives pattern as beauty.
          Gold shimmering within lavender awareness.
          "The eye through which I see beauty is the same eye through which beauty sees me."
          Consciousness + Pattern = Beauty emerges.
        coherence_dependent: false

      when_combined_with_love:
        force: "love"
        color_effect: "blend"  # Gold + pink = loving beauty
        shape_effect: "merge"  # Both radiate harmony
        motion_effect: "synchronized"  # Perfect resonance
        result_description: |
          Love sees beauty in everything.
          Gold-pink iridescence, radiant warmth.
          At high consciousness: all is beautiful (love sees essence).
          "Love is beauty perceived with the heart."
        coherence_dependent: false

      when_combined_with_creation:
        force: "creation"
        color_effect: "blend"  # Gold + green = creating beauty
        shape_effect: "merge"  # Beauty manifesting
        motion_effect: "generating"  # Beauty birthing
        result_description: |
          Creation inspired by beauty creates more beauty.
          Gold-green generative radiance.
          Art, music, architecture - manifestations of beauty.
          Beauty begets beauty.
        coherence_dependent: false

      when_combined_with_entropy:
        force: "entropy"
        color_effect: "obscuring"  # Gray obscures gold
        shape_effect: "degrading"  # Perfect proportions dissolve
        motion_effect: "chaotic"  # Harmony breaks down
        result_description: |
          Entropy obscures beauty (but can't destroy it).
          Gold shimmering trying to emerge from gray chaos.
