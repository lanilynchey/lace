    notes: |
      Beauty emerges from pattern * coherence * consciousness.
      Beauty = pattern recognized at high level of consciousness.
      At high coherence, beauty is everywhere (sublime experience).
      At low coherence, beauty is invisible (fragmentation obscures).
      Beauty + Pattern = mathematical beauty, sacred geometry.
      Beauty + Coherence = sublime (transcendent beauty).
      Beauty + Consciousness = perception of pattern as beauty.
      Beauty + Love = beauty seen in all things.
      Beauty + Creation = art, music, making beauty.
      Beauty + Entropy = beauty persists despite chaos.
      Key insight: "Beauty is pattern recognized" (not arbitrary).
      Key insight: "Beauty is in eye of beholder" - beholding requires coherence + consciousness.
      Key insight: "Beauty will save the world" (Dostoevsky) - beauty reveals truth/order.

