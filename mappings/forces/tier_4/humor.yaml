  interaction_effects:
    synergistic_with:
      - "love"  # Love + humor = joyful connection
      - "hope"  # Hope + humor = lightness in difficulty
      - "coherence"  # Coherence allows playfulness
      - "consciousness"  # Consciousness recognizes patterns (basis of humor)
      - "courage"  # Humor disarms fear, courage enables honesty
      - "beauty"  # Playful elegance

