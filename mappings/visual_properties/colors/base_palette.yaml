# === USAGE NOTES ===
usage_notes: |
  Base Palette Purpose:
  - Defines the PRIMARY color identity for each force
  - This is the starting point before any modifiers are applied
  - Agent looks up base color first, then applies:
    1. Intensity modifiers (see intensity_mapping.yaml)
    2. Interaction effects (see interaction_effects.yaml)
    3. Coherence effects (see coherence_effects.yaml)

  Color Selection Principles:
  - Colors must be visually distinguishable
  - Hex codes ensure exact reproduction
  - Color families (warm/cool/neutral) create intuitive associations
  - Related forces have related colors (but remain distinct)

  Agent Implementation:
  ```python
  def get_base_color(force_name):
      palette = load_yaml('base_palette.yaml')
      return palette['base_palette'][tier][force_name]['hex']
  ```
