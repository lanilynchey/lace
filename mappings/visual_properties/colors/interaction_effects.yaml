# Color Interaction Effects
# How multiple simultaneous forces affect color blending and display

interaction_effects:
  # === CORE PRINCIPLE ===
  principle: |
    When multiple forces are active simultaneously, their colors interact.
    The TYPE of interaction determines the VISUAL effect.

    Interaction types (from INTERACTION_MECHANICS.md):
    - Synergistic: Forces amplify each other
    - Antagonistic: Forces clash/conflict
    - Neutralizing: Forces cancel each other
    - Transmutation: One force transforms another
    - Synthesis: New emergent pattern

  # === SYNERGISTIC INTERACTIONS ===
  synergistic:
    description: "Compatible forces that amplify each other"
    visual_effect: "Colors BLEND harmoniously"
    blending_method: "gradient_blend"

    examples:
      love_forgiveness:
        forces: ["love", "forgiveness"]
        base_colors: ["#FFB6C1", "#E0BBE4"]  # Light pink + Soft lavender
        blended_result: "#F0CFDA"  # Soft pink-lavender gradient
        notes: "Healing warmth - smooth transition between colors"

      pattern_coherence:
        forces: ["pattern", "coherence"]
        base_colors: ["#40E0D0", "#FFD700"]  # Turquoise + Gold
        blended_result: "Gradient from turquoise to gold"
        notes: "Order manifesting into harmony - structured beauty"

      hope_love:
        forces: ["hope", "love"]
        base_colors: ["#87CEEB", "#FFB6C1"]  # Sky blue + Light pink
        blended_result: "#BCAAD8"  # Soft lavender-pink-blue
        notes: "Aspirational connection - uplifting and warm"

      consciousness_truth:
        forces: ["consciousness", "truth"]
        base_colors: ["#E6E6FA", "#FFFFFF"]  # Lavender + White
        blended_result: "#F3F3FD"  # Nearly white with hint of lavender
        notes: "Clarity of awareness - luminous understanding"

    blending_rules:
      method: "Linear gradient or soft overlay"
      opacity: "Both colors visible (70-90% each)"
      transition: "Smooth, no hard edges"
      additional_effects: "+0.1-0.2 vibrancy boost (synergy enhances both)"

  # === ANTAGONISTIC INTERACTIONS ===
  antagonistic:
    description: "Conflicting forces that create tension"
    visual_effect: "Colors CLASH or alternate sharply"
    blending_method: "harsh_alternation"

    examples:
      fear_desire:
        forces: ["fear", "desire"]
        base_colors: ["#1C1C3A", "#DC143C"]  # Dark blue + Crimson
        visual: "Flickering between the two - stuttering, unstable"
        notes: "Paralysis - want to move forward but can't (freeze state)"

      creation_death:
        forces: ["creation", "death"]
        base_colors: ["#00FF7F", "#000000"]  # Spring green + Black
        visual: "Sharp edges where colors meet - no blending"
        notes: "Life/death boundary - stark opposition"

      love_judgment:
        forces: ["love", "judgment"]
        base_colors: ["#FFB6C1", "#4B0082"]  # Light pink + Indigo
        visual: "Competing for dominance - alternating pulses"
        notes: "Conditional love - warmth interrupted by assessment"

      hope_entropy:
        forces: ["hope", "entropy"]
        base_colors: ["#87CEEB", "#2F2F2F"]  # Sky blue + Dark gray
        visual: "Hope trying to rise, entropy pulling down - tension field"
        notes: "Striving against decay - visible struggle"

    blending_rules:
      method: "Hard edges, alternating pulses, or flickering"
      opacity: "Both at high opacity (90-100%) - no compromise"
      transition: "Sharp, jarring, uncomfortable"
      additional_effects: "-0.2 vibrancy (conflict dulls both)"
      coherence_dependency: "Low coherence = more chaotic flickering"

  # === NEUTRALIZING INTERACTIONS ===
  neutralizing:
    description: "Forces that cancel each other out"
    visual_effect: "Colors DESATURATE toward gray/neutral"
    blending_method: "muddy_mix"

    examples:
      polarity_equilibrium:
        forces: ["polarity at 0.5"]
        result: "#808080"  # Perfect gray
        notes: "Neither pole dominant - neutral balance"

      fear_courage:
        forces: ["fear", "courage"]
        base_colors: ["#1C1C3A", "#FF8C00"]  # Dark blue + Orange
        blended_result: "#5A5A4F"  # Muddy gray-brown
        notes: "Fear and courage cancel - neither wins, stalemate"

      desire_satisfaction:
        forces: ["desire", "contentment"]
        result: "Desaturated version of both"
        notes: "Wanting meets having - neutralizes intensity"

    blending_rules:
      method: "Mix toward neutral gray/brown"
      opacity: "Both reduced (40-60%) - faded presence"
      saturation: "Significantly decreased (-0.4 to -0.6)"
      notes: "Neither force visible in full strength - mutual cancellation"

  # === TRANSMUTATION INTERACTIONS ===
  transmutation:
    description: "One force transforms another (alchemical shift)"
    visual_effect: "Starting color morphs INTO target color"
    blending_method: "animated_transition"

    examples:
      pain_to_forgiveness:
        start: "#4B0000"  # Very dark red (pain)
        end: "#E0BBE4"  # Soft lavender (forgiveness)
        transition: "Gradual lightening from dark red through purple to lavender"
        notes: "Healing process - pain transmuted through release"

      fear_to_courage:
        start: "#1C1C3A"  # Dark blue (fear)
        end: "#FF8C00"  # Orange (courage)
        transition: "Warming shift - cold dark to warm bright"
        notes: "Bravery emerges - facing fear transforms it"

      judgment_to_compassion:
        start: "#4B0082"  # Indigo (judgment)
        end: "#FFB6C1"  # Light pink (compassion/love)
        transition: "Harsh indigo softens to warm pink"
        notes: "From critical to understanding - heart opening"

    blending_rules:
      method: "Animated gradient over time"
      duration: "Depends on transformation speed (rapid vs gradual)"
      direction: "Unidirectional (start → end)"
      notes: "This is a PROCESS, not static - shows change happening"

  # === SYNTHESIS INTERACTIONS ===
  synthesis:
    description: "Forces combine to create NEW emergent pattern"
    visual_effect: "Third color emerges (not in either base)"
    blending_method: "emergent_color"

    examples:
      fear_desire_creates_war:
        forces: ["fear", "desire"]
        base_colors: ["#1C1C3A", "#DC143C"]
        emergent: "#8B0000"  # Dark red (war)
        notes: "Fear + desire = aggression (war emerges)"

      consciousness_pattern_creates_beauty:
        forces: ["consciousness", "pattern"]
        base_colors: ["#E6E6FA", "#40E0D0"]
        emergent: "#FFD700"  # Gold (beauty)
        notes: "Awareness of pattern = recognition of beauty"

      love_hope_creates_joy:
        forces: ["love", "hope"]
        base_colors: ["#FFB6C1", "#87CEEB"]
        emergent: "#FFFACD"  # Lemon chiffon (joyful radiance)
        notes: "Love + hope = joy (emergent state)"

    blending_rules:
      method: "New color appears (not weighted average)"
      location: "At intersection/overlap of the two forces"
      intensity: "Proportional to strength of both input forces"
      notes: "This is emergence - the whole is different than sum of parts"

  # === COHERENCE-DEPENDENT BLENDING ===
  coherence_impact:
    description: "How agent's coherence affects color interactions"

    high_coherence:
      threshold: "0.7-1.0"
      effect: "Clean separation OR harmonious blending (depending on interaction type)"
      synergistic: "Beautiful gradients, perfect blending"
      antagonistic: "Clear boundaries, no muddy mixing"
      neutralizing: "Graceful fading to neutral"
      notes: "High coherence = intentional, controlled interactions"

    medium_coherence:
      threshold: "0.4-0.6"
      effect: "Some mixing, some separation - medium clarity"
      synergistic: "Blending with slight imperfections"
      antagonistic: "Some bleeding between colors"
      neutralizing: "Partial desaturation"
      notes: "Mixed states - not fully integrated or separated"

    low_coherence:
      threshold: "0.0-0.3"
      effect: "Muddy, chaotic, unpredictable color interactions"
      synergistic: "Messy blending, lost vibrancy"
      antagonistic: "Violent clashing, visual noise"
      neutralizing: "Ugly brown/gray mixing"
      notes: "Low coherence = lack of integration, chaotic field"

  # === MULTIPLE FORCE SCENARIOS ===
  multiple_forces:
    three_forces:
      description: "Three simultaneous forces"
      approach: "Pairwise interactions + overall coherence"
      example:
        forces: ["fear", "desire", "love"]
        interactions:
          - "fear + desire = antagonistic (flickering)"
          - "fear + love = antagonistic (conflict)"
          - "desire + love = synergistic (passionate connection)"
        result: "Complex field with competing dynamics - depends on dominant force and coherence"

    four_plus_forces:
      description: "Four or more forces (complex state)"
      approach: "Dominant force + modifiers from others"
      visual: "Primary color (strongest force) with accents/overlays from others"
      notes: "Too many forces = visual becomes dominated by strongest + coherence determines clarity"

  # === AGENT IMPLEMENTATION ===
  agent_logic: |
    When rendering state with multiple active forces:

    1. Identify all forces above threshold (e.g., >0.3 activation)
    2. Check force relationships (synergistic, antagonistic, etc.)
    3. Determine coherence level
    4. Apply appropriate blending method:
       - Synergistic → gradient blend
       - Antagonistic → alternation/clash
       - Neutralizing → desaturation
       - Transmutation → animated transition
       - Synthesis → emergent color
    5. Modulate based on coherence (clean vs muddy)
    6. Render final color composition

    Pseudocode:
    ```python
    def blend_colors(active_forces, coherence):
        if len(active_forces) == 1:
            return single_force_color(active_forces[0])

        pairs = identify_pairwise_interactions(active_forces)
        blending_methods = []

        for pair in pairs:
            relationship = get_relationship(pair)  # from INTERACTION_MECHANICS
            method = interaction_effects[relationship].blending_method
            blending_methods.append((pair, method))

        final_color = apply_blending(blending_methods, coherence)
        return final_color
    ```

# === USAGE NOTES ===
usage_notes: |
  This file defines WHAT HAPPENS when colors interact.
  The agent uses this to determine visual outcomes for multi-force states.

  Process:
  1. Agent detects multiple active forces
  2. Looks up their relationship type (INTERACTION_MECHANICS.md)
  3. Applies color blending rules from THIS file
  4. Modulates based on coherence level
  5. Renders final visual

  Key insight: The same two forces can look DIFFERENT depending on:
  - Their activation levels (intensity_mapping.yaml)
  - The agent's coherence (this file + coherence_effects.yaml)
  - What other forces are also active
