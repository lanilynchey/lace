# Lifestyle Factor: Creative Expression

creative_expression:
  # === METADATA ===
  metadata:
    category: "creative_expressive"
    measurement_type: "subjective_and_objective"  # Time spent + felt sense of expression
    update_frequency: "weekly"
    importance: "high"  # Creativity is fundamental human need

  # === THRESHOLDS ===
  thresholds:
    low:
      range: "0.0-0.3"
      description: "No creative outlet - purely consuming, not creating or expressing"
      indicators:
        - "No creative activity"
        - "Pure consumption (media, content)"
        - "No making, building, expressing"
        - "Feel stifled, blocked, stuck"

    medium:
      range: "0.4-0.7"
      description: "Some expression - occasional creative activity, exploring"
      indicators:
        - "Creative activity 1-3 hours per week"
        - "Dabbling in art, music, writing, making"
        - "Some expression, not consistent"
        - "Feel okay but could use more"

    high:
      range: "0.8-1.0"
      description: "Regular creative practice - consistent expression, making, creating"
      indicators:
        - "Creative activity 4+ hours per week"
        - "Consistent practice (art, music, writing, building, etc.)"
        - "Expression integrated into life"
        - "Feel alive, expressed, flowing"

  # === FORCE IMPACTS ===
  force_impacts:
    creation:
      low: -0.25    # Not creating = core capacity atrophying
      medium: +0.15
      high: +0.35   # Regular creative practice amplifies generative force
      notes: "Creativity is muscle - use it or lose it"

    art:
      low: -0.20    # No artistic expression
      medium: +0.10
      high: +0.30   # Regular practice develops artistic force
      notes: "Art emerges through practice - can't think your way to art"

    coherence:
      low: -0.10    # Blocked expression fragments
      medium: +0.10
      high: +0.20   # Expression integrates, completes cycles
      notes: "Expression completes the circuit - what's inside comes out, cycle completes"

    joy:
      low: -0.15    # No play, no joy
      medium: +0.10
      high: +0.25   # Creative play = pure joy
      notes: "Creativity is play - children know this, adults forget"

    courage:
      low: -0.10    # Not creating = playing safe
      medium: +0.10
      high: +0.20   # Creating requires courage (vulnerability of sharing)
      notes: "Every act of creation is vulnerable - putting self into world"

    meaning:
      low: -0.15    # Pure consumption = hollow
      medium: +0.10
      high: +0.25   # Creating = meaning making
      notes: "We find meaning through making - legacy, contribution, self-expression"

    desire:
      low: -0.10    # Blocked expression dampens desire
      medium: +0.05
      high: +0.15   # Expression fuels more desire to express
      notes: "Creativity begets creativity - desire to create grows with creating"

    identity:
      low: -0.10    # Not expressing = not fully self
      medium: +0.10
      high: +0.20   # Expression reveals and creates identity
      notes: "We discover who we are through what we make"

    flow_states:
      low: -0.15    # No creative flow
      medium: +0.15
      high: +0.30   # Creative work = primary flow state access
      notes: "Flow most accessible in creative practice - challenge meets skill"

  # === TEMPORAL DYNAMICS ===
  temporal_dynamics:
    acute_impact: "immediate"  # Single creative session improves mood
    chronic_impact: "identity_shaping"  # Regular practice shapes who you become
    recovery_time: "Creative muscles atrophy quickly without use, return with practice"

    notes: |
      Creativity is not talent - it's practice.
      "Amateur" originally meant "lover of" - do it for love, not money.
      Creative confidence built through consistent practice.

  # === INTERACTION EFFECTS ===
  interaction_effects:
    amplifies:
      - self_knowledge: "We learn who we are through what we make"
      - emotional_processing: "Art processes what words cannot"
      - flow_states: "Creative work = primary flow access"

    dampens:
      - depression: "Creating = antidepressant (making vs consuming)"
      - stagnation: "Creating = growth, evolution, change"
      - disconnection: "Sharing creative work = connection"

    synergizes_with:
      - play: "Creativity is adult play"
      - courage: "Creating requires vulnerability"
      - community: "Creating together = bonding"

  # === NOTES ===
  notes: |
    Everyone is creative - creativity is not limited to "art."
    Creativity includes:
    - Art (painting, drawing, sculpture)
    - Music (playing, composing, singing)
    - Writing (poetry, stories, journaling)
    - Building (carpentry, crafting, making)
    - Cooking (experimenting, creating dishes)
    - Gardening (growing, designing, tending)
    - Dance (moving, expressing through body)
    - Problem-solving (engineering, design thinking)

    Key insights:
    - "Creative" vs "not creative" is false binary
    - Creativity = fundamental human capacity
    - Blocking creativity = blocking vitality
    - "Bad" art is better than no art
    - Process > product (journey > destination)
    - Perfectionism is creativity's enemy

    "Every child is an artist. The problem is how to remain an artist once we grow up." - Picasso

    Creativity myths to release:
    - Myth: "I'm not creative" (Yes you are, been trained out of it)
    - Myth: "I need talent" (No, need practice)
    - Myth: "It needs to be good" (No, needs to be made)
    - Myth: "I need time/space/supplies" (Start small, start now)

    Consumption vs Creation:
    - Consuming = passive, depleting
    - Creating = active, energizing
    - Modern life = consumption heavy (rebalance needed)

    "Art is not a thing you do, it's a way you live." - Julia Cameron
    Create to express, not to impress.
