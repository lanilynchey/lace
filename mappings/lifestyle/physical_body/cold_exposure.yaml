# Lifestyle Factor: Cold Exposure (Cold Therapy)

cold_exposure:
  # === METADATA ===
  metadata:
    category: "physical_body"
    measurement_type: "objective"  # Minutes per week in cold exposure
    update_frequency: "weekly"
    importance: "medium_to_high"  # Emerging research, significant impacts

  # === THRESHOLDS ===
  thresholds:
    low:
      range: "0.0-0.3"
      description: "No cold exposure - always comfortable temperature, cold avoided"
      indicators:
        - "No deliberate cold exposure"
        - "Hot showers only"
        - "Cold weather avoided"
        - "Temperature always comfortable"
        - "No cold water immersion"

    medium:
      range: "0.4-0.7"
      description: "Occasional cold - cold showers sometimes, moderate exposure"
      indicators:
        - "1-3 cold exposures per week"
        - "30 second cold shower finishes"
        - "Occasional cold water swimming"
        - "Some tolerance building"
        - "Beginning adaptation"

    high:
      range: "0.8-1.0"
      description: "Regular practice - consistent cold exposure, adapted, intentional"
      indicators:
        - "4-7 cold exposures per week"
        - "2-3 minute cold showers or 1-5 min ice baths"
        - "Regular cold water immersion"
        - "Significant adaptation (less uncomfortable)"
        - "Cold exposure as practice, not just tolerance"

  # === FORCE IMPACTS ===
  force_impacts:
