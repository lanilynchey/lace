  # === NOTES ===
  notes: |
    Cold exposure is hormetic stressor - manageable stress that strengthens.
    Ancient practice (cold water therapy), modern science validates.

    Key insights:
    - Cold = manageable stress (hormesis principle)
    - Adaptation happens quickly (weeks)
    - Benefits physical and psychological
    - Not about suffering - about building capacity
    - Wim Hof Method popularized (cold + breath)

    What cold exposure does:

    **Physiological:**
    - Activates brown fat (thermogenesis, metabolic boost)
    - Releases norepinephrine (focus, alertness)
    - Releases dopamine (mood, motivation)
    - Releases endorphins (natural high)
    - Reduces inflammation markers
    - Increases white blood cells (immune function)
    - Vasoconstriction → vasodilation (circulation training)
    - Activates vagus nerve (parasympathetic)

    **Psychological:**
    - Builds stress resilience (train response)
    - Increases willpower (do hard thing daily)
    - Enhances mood (endorphins, dopamine)
    - Creates presence (can't be elsewhere in cold)
    - Builds confidence ("I can do hard things")
    - Reduces stress reactivity (calm under pressure)

    Cold exposure methods:

    **Cold showers:**
    - Easiest, most accessible
    - Start warm, end cold (30 seconds to start)
    - Build to 2-3 minutes cold
    - Morning = most awakening
    - Breathe slowly (calm nervous system)

    **Ice baths:**
    - More intense, faster adaptation
    - 38-50°F (3-10°C) water
    - 1-5 minutes (start lower)
    - Post-exercise recovery
    - Requires tub, ice

    **Cold water immersion:**
    - Lakes, oceans, rivers
    - Natural cold exposure
    - Community practice (cold plunge groups)
    - Seasonal availability

    **Cryotherapy:**
    - Extreme cold (-200°F) for 2-3 minutes
    - Commercial chambers
    - Expensive but effective
    - Different mechanism (dry vs wet cold)

    How to start:

    **Week 1:**
    - 10 seconds cold at end of shower
    - Focus on breath (stay calm)
    - 3-4 times per week

    **Week 2-3:**
    - 30 seconds cold
    - Keep breathing slow
    - Notice discomfort vs danger (just uncomfortable)

    **Week 4+:**
    - 1-2 minutes cold
    - Full body immersion
    - Adaptation noticeable (less shocking)

    Key technique:
    - **Breath control = cold tolerance**
    - Slow, controlled breathing (don't gasp)
    - 4-4 or 5-5 breath (coherent breathing)
    - Calm breath = calm nervous system

    Wim Hof Method:
    - Breath work (hyperventilation + holds)
    - Cold exposure
    - Commitment/mindset
    - Research validated: control over immune response, inflammation

    Safety considerations:
    - No cold immersion alone (drowning risk)
    - Heart conditions: consult doctor
    - Start gradual (don't shock system)
    - Exit if feel faint, numb fingers/toes
    - Warm up slowly after (not hot shower immediately)

    When to use:
    - Morning = awakening, energizing
    - Post-exercise = recovery, anti-inflammatory
    - Stress = resilience training
    - Low mood = dopamine boost
    - Before important task = alertness, focus

    Common mistakes:
    - Starting too intense (shock, quit)
    - Holding breath (increases stress)
    - Doing alone (safety risk)
    - No gradual adaptation (miserable experience)
    - Hot shower immediately after (negates some benefits)

    Benefits timeline:
    - Immediate: alertness, mood boost, presence
    - Days: sleep improvement, energy
    - Weeks: adaptation (less uncomfortable), stress resilience
    - Months: baseline changes (immune, inflammation, mood)

    Cold exposure is practice of staying calm when uncomfortable.
    Life skill: uncomfortable ≠ dangerous.
    Cold teaches this viscerally.

    "What is the cold?
    It's just cold.
    How you respond to it is what matters." - Wim Hof

    Cold exposure = voluntary discomfort that builds involuntary resilience.

