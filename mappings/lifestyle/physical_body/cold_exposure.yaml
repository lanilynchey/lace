      high: +0.20   # Cold improves mood (endorphins, dopamine)
      notes: "Cold exposure = dopamine surge, endorphin release"

    inflammation:
      low: 0.0
      medium: -0.05
      high: -0.20   # Cold is anti-inflammatory
      notes: "Cold = reduces inflammation markers, activates anti-inflammatory pathways"

    immune_function:
      low: 0.0
      medium: +0.05
      high: +0.15   # Cold strengthens immune system
      notes: "Regular cold exposure = increased white blood cells, stronger immune response"

    metabolism:
