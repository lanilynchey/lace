## LIFESTYLE FACTOR ONSET TIMELINES

lifestyle_factor_onset_categories:
  source: "mappings/schemas/lifestyle_factor_schema.md (temporal_dynamics field structure)"
  note: "Categories display practical patterns. Individual factors have detailed specifics."

  immediate_onset:
    timeframe: "Within minutes to hours"
    examples:
      - factor: "caffeine"
        effect: "Consciousness +0.05-0.10, focus improvement"
        onset: "15-30 minutes"
        duration: "2-4 hours"
        decay: "Gradual over 4-6 hours"

      - factor: "meditation (single session)"
        effect: "Coherence +0.05-0.10, fear -0.10-0.15"
        onset: "During practice (20 min)"
        duration: "1-3 hours post-practice"
        decay: "Moderate (fades by end of day)"

      - factor: "outdoor time (nature exposure)"
        effect: "Coherence +0.03-0.08, entropy -0.05"
        onset: "Within 20 minutes"
        duration: "2-6 hours"
        decay: "Moderate (fades over hours)"

      - factor: "argument/conflict"
        effect: "Coherence -0.10-0.20, fear +0.10-0.30"
        onset: "Immediate"
        duration: "Hours to days (depending on resolution)"
        decay: "Fast if resolved, slow if unresolved"

  short_term_onset:
    timeframe: "Within 1-7 days"
    examples:
      - factor: "sleep improvement"
        effect: "Coherence +0.08-0.15, consciousness +0.05"
        onset: "2-3 days of 7+ hours/night"
        duration: "Sustained while maintained"
        decay: "Moderate (2-3 days after sleep deprivation returns)"

      - factor: "exercise routine (starting)"
        effect: "Entropy -0.05-0.10, coherence +0.05-0.10"
        onset: "3-5 days of consistent movement"
        duration: "Sustained while maintained"
        decay: "Moderate (1-2 weeks after stopping)"

      - factor: "social connection increase"
        effect: "Love +0.10-0.20, fear -0.05-0.10"
        onset: "Within days of positive interactions"
        duration: "While connections maintained"
        decay: "Slow (weeks without connection)"

  long_term_onset:
    timeframe: "Weeks to months (7+ days)"
    examples:
      - factor: "diet improvement"
        effect: "Coherence +0.10-0.18, entropy -0.10-0.20"
        onset: "2-4 weeks of whole foods"
        duration: "Sustained while maintained"
        decay: "Slow (2-4 weeks after returning to processed food)"
        cumulative: true

      - factor: "meditation practice (daily)"
        effect: "Consciousness +0.10-0.20, coherence +0.10-0.20"
        onset: "4-8 weeks of daily practice"
        duration: "Baseline shift (sustained even without daily practice)"
        decay: "Very slow (months without practice)"
        cumulative: true

      - factor: "therapy (consistent)"
        effect: "Coherence +0.15-0.30, fear -0.10-0.25, pain transmuted"
        onset: "6-12 weeks of weekly sessions"
        duration: "Baseline shift (internalized insights)"
        decay: "Very slow (gains mostly permanent)"
        cumulative: true

      - factor: "chronic stress (sustained)"
        effect: "Coherence -0.15-0.30, entropy +0.10-0.20"
        onset: "4-8 weeks of unrelenting stress"
        duration: "While stress continues"
        decay: "Slow recovery (4-12 weeks with intervention)"
        cumulative: true

