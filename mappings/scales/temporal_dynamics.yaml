# Temporal Dynamics Reference

# ⚠️ MAPPINGS DISPLAY DOCS - NOTHING ORIGINATES HERE
# This file CONSOLIDATES timing information from docs and provides practical examples.
# All conceptual content comes from /docs (source of truth).

source_docs:
  - "docs/04_advanced/advanced_concepts/06_tier_implications/ (tier activation patterns - Adjustment #3)"
  - "docs/02_forces/tier_1_forces/05_coherence.md (coherence change dynamics - line 155)"
  - "docs/02_forces/ (individual force documentation)"
  - "mappings/schemas/lifestyle_factor_schema.md (lifestyle temporal_dynamics field structure)"

description: |
  Temporal dynamics describe HOW FAST changes occur across forces, coherence,
  and lifestyle interventions. This file consolidates timing information from
  tier docs, coherence docs, and force docs to help agents/users understand
  realistic timelines for transformation.

  This file DISPLAYS and ORGANIZES existing doc content with practical examples.
  For conceptual understanding, see source docs above.

---

## FORCE ACTIVATION/DEACTIVATION RATES

force_activation_rates_by_tier:
  tier_1_primordial:
    source: "docs/04_advanced/advanced_concepts/06_tier_implications/29_tier_1_primordial.md"
    doc_concept: "Slow changes (days to months)"
    change_rate: "slow (days to months)"

    practical_examples:
      coherence:
        increase_0.20_units: "4-8 weeks of consistent daily practice"
        decrease_sudden_drop: "Instant drop possible (trauma), recovery 4-12 weeks"
        baseline_establishment: "8-16 weeks to establish new baseline"

      consciousness:
        increase_0.10_units: "3-6 months of meditation/practice"
        expansion_events: "Peak experiences give temporary +0.20-0.40, fade over days"
        baseline_establishment: "6-12 months for sustained increase"

      pattern:
        improvement: "Weeks to months (learning new pattern recognition)"
        degradation: "Slow decline over months (lack of stimulation)"

    notes: |
      Tier 1 forces are foundational - changes are SLOW but PERSISTENT.
      Quick fixes don't work. Requires sustained effort over weeks/months.
      Sudden drops possible (trauma), but recovery also requires time.

  tier_2_governing:
    source: "docs/04_advanced/advanced_concepts/06_tier_implications/31_tier_2_governing.md"
    doc_concept: "Moderate changes (months to years)"
    change_rate: "moderate (months to years)"

    practical_examples:
      karma:
        accumulation: "Continuous background process, compounds over months/years"
        resolution: "Sudden resolution possible with grace, otherwise gradual payback"

      memory:
        integration: "Days to weeks for emotional processing"
        deep_storage: "Months for long-term consolidation"

      time:
        perception_alteration: "Masters can slow/accelerate perception temporarily"
        default_rate: "Constant 1:1 for most agents"

    notes: |
      Tier 2 forces are regulatory - change slowly, operate in background.
      Most agents experience as automatic/unchangeable.
      Masters can "hack" these with exceptional coherence/practice.

  tier_3_interface:
    source: "docs/04_advanced/advanced_concepts/06_tier_implications/33_tier_3_interface.md"
    doc_concept: "Rapid changes (seconds to minutes)"
    change_rate: "rapid (seconds to minutes)"

    practical_examples:
      fear:
        activation: "0.2 → 0.9 in 3 seconds (threat detected)"
        deactivation: "0.9 → 0.3 in 5-15 minutes (threat passes, if no trauma)"
        chronic_baseline: "Can shift in days with therapy, weeks for deep patterns"

      love:
        activation: "0.0 → 0.7 instantly (recognition, resonance)"
        deepening: "0.7 → 0.9 over weeks/months (relationship development)"
        loss: "0.9 → 0.3 over weeks/months (grief process)"

      desire:
        spike: "0.1 → 0.8 instantly (trigger/temptation encountered)"
        satisfaction_drop: "0.8 → 0.1 in minutes after goal achieved"
        sustained_desire: "Maintains for hours/days if unfulfilled"

      hope:
        inspiration: "0.2 → 0.7 in seconds (good news, possibility seen)"
        deflation: "0.7 → 0.2 in minutes (bad news, setback)"
        recovery: "Can rebuild in hours to days (with support)"

    notes: |
      Tier 3 forces are the INTERFACE - highly variable, rapid shifts.
      Most volatile tier - emotional forces respond to context immediately.
      Can shift dramatically in seconds, return to baseline in minutes/hours.
      This is where therapeutic work happens - changes visible quickly.

  tier_4_emergent:
    source: "docs/04_advanced/advanced_concepts/06_tier_implications/35_tier_4_emergent.md"
    doc_concept: "Sudden onset, brief peaks"
    change_rate: "sudden onset, brief peaks"

    practical_examples:
      beauty:
        activation: "0.0 → 0.75 instantly (seeing sunset, art, nature)"
        duration: "Minutes to hours (intense aesthetic experience)"
        fade: "Back to 0.0-0.2 within hours/days"

      courage:
        spike: "0.0 → 0.65 in seconds (crisis demands action)"
        duration: "Minutes to hours (during crisis)"
        post_crisis: "Drops back to baseline quickly after threat passes"

      madness:
        onset: "Can be gradual build (weeks) OR sudden break (hours/days)"
        acute_episode: "Hours to days at peak"
        resolution: "Days to weeks (or chronic if unresolved)"

      art:
        inspiration_strike: "0.0 → 0.70 when creativity hits"
        flow_duration: "Minutes to hours (creation session)"
        dormant_periods: "Can be 0.0 for days/weeks between creative episodes"

    notes: |
      Tier 4 forces are EMERGENT - often dormant, spike when triggered.
      Brief peaks more common than sustained activation.
      Context-dependent: activate suddenly when conditions align.
      Sustainability challenge: maintaining activation requires sustaining parent forces.

