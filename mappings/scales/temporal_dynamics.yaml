## DECAY RATES

effect_decay_rates:
  description: "How quickly effects fade without ongoing maintenance (practical patterns)"

  fast_decay:
    timeframe: "Hours to 1 day"
    examples:
      - "Caffeine effects (4-6 hours)"
      - "Single meditation session (fades by evening)"
      - "Outdoor time boost (fades within day)"
      - "Acute fear spike (minutes to hours if threat passes)"
    maintenance: "Must repeat daily/multiple times per day to sustain"

  moderate_decay:
    timeframe: "1-7 days"
    examples:
      - "Sleep improvement (2-3 days without good sleep)"
      - "Exercise session benefits (3-5 days)"
      - "Social connection boost (3-7 days without contact)"
      - "Acute coherence gain from practice (3-5 days without practice)"
    maintenance: "Must repeat several times per week to sustain"

  slow_decay:
    timeframe: "Weeks to months"
    examples:
      - "Diet improvements (2-4 weeks after reverting)"
      - "Exercise routine baseline (1-2 weeks after stopping)"
      - "Therapy gains (months - mostly permanent)"
      - "Meditation baseline increase (2-3 months without practice)"
    maintenance: "Weekly/biweekly practice sufficient to maintain"

  permanent_baseline_shift:
    timeframe: "Does not decay (internalized)"
    examples:
      - "Deep therapeutic insights (permanent once integrated)"
      - "Consciousness expansion from peak experience (some permanent residue)"
      - "Trauma resolution (permanent once processed)"
      - "Mastery skill acquisition (permanent neural pathways)"
    maintenance: "No maintenance required (baseline permanently raised)"

