## COMPOUNDING EFFECTS

cumulative_dynamics:
  positive_compounding:
    description: "Effects build over time with consistent application (practical pattern)"

    examples:
      meditation_practice:
        week_1: "Small immediate effects (+0.03 coherence during practice)"
        month_1: "Noticeable baseline shift (+0.08 coherence sustained)"
        month_3: "Significant shift (+0.15 coherence, +0.08 consciousness)"
        year_1: "Transformative (+0.25 coherence, +0.15 consciousness)"
        notes: "Compounds logarithmically (early gains fast, later gains slower)"

      therapy_cumulative:
        month_1: "Initial insights, small shifts"
        month_3: "Pattern recognition, moderate healing"
        month_6: "Deep integration, significant transformation"
        year_1: "Baseline personality shifts, trauma resolved"
        notes: "Non-linear - breakthroughs happen in jumps, not smooth curve"

  negative_compounding:
    description: "Negative effects worsen over time without intervention (practical pattern)"

    examples:
      chronic_stress:
        week_1: "Manageable (-0.05 coherence)"
        month_1: "Noticeable decline (-0.12 coherence)"
        month_3: "Significant degradation (-0.20 coherence, health impacts)"
        month_6: "Breakdown risk (-0.30+ coherence, burnout, illness)"
        notes: "Accelerates over time - harder to recover the longer it continues"

      sleep_deprivation:
        day_1: "Minor impact (-0.03 coherence)"
        week_1: "Moderate impact (-0.10 coherence, -0.05 consciousness)"
        month_1: "Severe impact (-0.20 coherence, health decline)"
        notes: "Compounds quickly - sleep debt accumulates, harder to recover"

