disclaimers: |
  This file consolidates temporal information from tier docs, force docs, and
  coherence docs into a comprehensive reference. All timing estimates are
  approximate - individual variation significant based on starting coherence,
  consciousness, support systems, and intensity of intervention.

  Timeline estimates assume:
  - Medium starting coherence (0.40-0.60)
  - Consistent effort (not sporadic)
  - Adequate support/resources
  - No major ongoing trauma

  Actual timelines may be faster (higher coherence, intensive intervention) or
  slower (lower coherence, ongoing stressors, inadequate support).

  For conceptual understanding of WHY these timelines exist, see source docs above.
  This file provides PRACTICAL EXAMPLES and CONSOLIDATION of existing doc content.
