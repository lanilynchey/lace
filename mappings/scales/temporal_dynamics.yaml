## IMPLEMENTATION NOTES

usage_guidelines:
  for_agents:
    - "Use these timelines to set realistic expectations for transformation"
    - "Quick fixes target Tier 3 (emotional shifts) - results visible in days"
    - "Foundational work targets Tier 1 (coherence, consciousness) - requires months"
    - "Combine fast wins (T3) with long-term investment (T1) for sustainable change"

  for_manifestation:
    - "High coherence (0.70+) = instant permission (hours to days)"
    - "Medium coherence (0.50-0.69) = delayed permission (days to weeks)"
    - "Low coherence (<0.50) = blocked or very slow (weeks to months, if at all)"
    - "Timeline depends on coherence level + desire intensity + pattern alignment"

  for_lifestyle_interventions:
    - "Immediate onset factors (meditation, nature) = use for acute state shifts"
    - "Short-term factors (sleep, exercise) = use for weekly baseline maintenance"
    - "Long-term factors (diet, therapy) = use for foundational transformation"
    - "Layer all three for comprehensive, sustainable change"

