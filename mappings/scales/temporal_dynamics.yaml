## COHERENCE SHIFT TIMELINES

coherence_shift_dynamics:
  source: "docs/02_forces/tier_1_forces/05_coherence.md (line 155: Coherence Change Dynamics and Rates)"

  increase_timelines:
    small_increase_0.10:
      practices: "Daily meditation, consistent sleep, reduced stress"
      timeframe: "2-4 weeks"

    moderate_increase_0.20:
      practices: "Intensive practice (therapy, meditation retreat, lifestyle overhaul)"
      timeframe: "4-8 weeks"

    large_increase_0.30_plus:
      practices: "Comprehensive transformation (therapy + practice + lifestyle + environment)"
      timeframe: "3-6 months"
      notes: "Rare, requires addressing multiple domains simultaneously"

  decrease_timelines:
    gradual_decline_0.10:
      causes: "Stress accumulation, poor sleep, lack of practice"
      timeframe: "2-4 weeks of neglect"

    moderate_decline_0.20:
      causes: "Sustained stress, trauma unprocessed, major life disruption"
      timeframe: "1-3 weeks"

    sudden_drop_0.30_plus:
      causes: "Acute trauma, major loss, psychotic break"
      timeframe: "Instant to days"
      recovery: "4-12 weeks minimum, often requires professional support"

  baseline_establishment:
    new_coherence_baseline:
      timeframe: "8-16 weeks of sustained practices"
      notes: |
        Reaching a new coherence level is one thing - MAINTAINING it requires
        ongoing practice. First 8 weeks = build, next 8 weeks = solidify.

  recovery_from_disruption:
    minor_disruption:
      example: "Bad week, sleep deprivation, conflict"
      recovery: "3-7 days with self-care"

    moderate_disruption:
      example: "Breakup, job loss, illness"
      recovery: "2-6 weeks with support/practice"

    major_disruption:
      example: "Death of loved one, severe trauma, major crisis"
      recovery: "3-12 months with therapy/support"

